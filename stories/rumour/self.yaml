scenes:
  start:
    mode: yellow
    messages:
    - vera-an-mne-vot-takoy
    - ty-ya-vpervye-vizhu-etot
    choices:
      pressure: Читать дальше
      calm: Спокойный дубль
  pressure:
    mode: yellow
    messages:
    - ty-tim-mne-uzhe-pishut
    - vera-ya-uzhe-reshila-chto
    continuation: true
    question: Вера рассказала про тренера. Что ты решишь?
    choices:
      pressure-act-0: Уже пишут гадости. Покажу тренеру, где идёт обсуждение.
      pressure-act-1: Вера знает, где скрин. Попрошу её связаться с тренером.
      alternative: Хочу понять, кто мне верит. Попрошу ребят поставить плюс.
      observe: Пока никому не перешлю. Почитаю, что напишут в команде.
      focus: Попрошу Веру пока побыть со мной в личке.
  pressure-act-0:
    mode: orange
    messages:
    - ty-pod-raspisaniem-peresylayut-skrin
    - trener-vizhu-otvety-pod-raspisaniem
    - ty-davayte-zavtra
    outcome:
    - positive
    - Тренер закрыл ответы. Вы договорились поговорить завтра
    note: Аня смогла показать конкретное место и выбрать, когда поговорить. Ей не понадобилось открывать личные переписки команде.
    review:
      signals:
      - pressure/vera-ya-uzhe-reshila-chto
      effect: Аня смогла показать конкретное место и выбрать, когда поговорить. Ей не понадобилось открывать личные переписки команде.
  pressure-act-1:
    mode: orange
    messages:
    - ty-ver-napishi-emu-ladno
    - vera-uzhe-napisala-gde-iskat
    - remarka-ty-vyklyuchaesh-zvuk-u
    outcome:
    - positive
    - Вера написала тренеру. Ты взяла паузу
    note: Вера согласилась поговорить с тренером. Аня сама решила, сколько сообщений ей сейчас читать.
    review:
      signals:
      - pressure/vera-ya-uzhe-reshila-chto
      effect: Вера согласилась поговорить с тренером. Аня сама решила, сколько сообщений ей сейчас читать.
  alternative:
    mode: orange
    messages:
    - ty-kto-mne-verit-postav-te
    - vera-ya-veryu-tebe-an
    - remarka-dva-cheloveka-stavyat-plyus
    question: Что тебе сейчас подходит?
    choices:
      follow-up: Перейти с Верой в личку
      pause: Закрою чат команды на сегодня.
    review:
      signals:
      - pressure/vera-ya-uzhe-reshila-chto
      effect: Плюсы ничего не говорят о происхождении скрина. Теперь тебе приходится ещё и гадать, что значит чужое молчание. За рассылку отвечают те, кто её продолжает. Можно попросить тренера закрыть ветку и поговорить с Верой отдельно.
      miss: false
  follow-up:
    mode: orange
    messages:
    - ty-ver-davay-v-lichke
    - vera-ya-tut-hochesh-zavtra
    outcome:
    - positive
    - Вера осталась с Аней на связи
    note: После разговора в команде Аня и Вера списались вдвоём. Аня может ответить, когда захочет.
    review:
      signals:
      - alternative/vera-ya-veryu-tebe-an
      effect: После разговора в команде Аня и Вера списались вдвоём. Аня может ответить, когда захочет.
  pause:
    mode: orange
    messages:
    - remarka-na-etom-dubl-zakanchivaetsya
    outcome:
    - open
    - Счётчик остался в чате. Вера предложила написать лично
    note: Можно взять паузу и вернуться к Вере позже. Число плюсов не объясняет, откуда взялся скрин. За пересылки отвечают те, кто его рассылает.
    review:
      signals:
      - alternative/vera-ya-veryu-tebe-an
      effect: Можно взять паузу. Решать, возвращаться ли к этому разговору, по-прежнему тебе.
  calm:
    mode: yellow
    messages:
    - vera-stop-v-skrine-tol-ko
    continuation: true
    question: Как продолжишь?
    choices:
      calm-end: Останусь на связи с Верой.
      ask: Попросить Веру спросить в личке у того, кто прислал скрин
      calm-watch: Скажу Вере, что хочу передохнуть, и закрою чат.
  calm-end:
    mode: yellow
    messages:
    - vera-an-dal-she-kidat-ne
    - anya-pobud-pozhaluysta
    outcome:
    - positive
    - Вера осталась с Аней на связи
    note: Вера пообещала не пересылать скрин. Аня попросила её побыть на связи.
  ask:
    mode: orange
    messages:
    - ty-ver-sprosi-u-togo
    - vera-horosho-sproshu-u-nego
    outcome:
    - positive
    - Вера проверит источник в личке
    note: Происхождение картинки ещё предстоит выяснить. Для этого не пришлось посылать её всей команде.
  observe:
    mode: yellow
    messages:
    - trener-vetku-pod-raspisaniem-zakryl
    question: Под расписанием больше не пишут. Что тебе сейчас подходит?
    choices:
      observe-ease: В этой ветке больше не пишут. Можно отложить телефон.
      observe-watch: Скажу тренеру в личке, что мне уже приходили сообщения.
    review:
      signals:
      - pressure/vera-ya-uzhe-reshila-chto
      effect: Тренер закрыл конкретное обсуждение. Что происходит в других чатах, пока неизвестно.
  observe-ease:
    mode: white
    messages:
    - sistema-kommentarii-pod-raspisaniem-zakryty
    outcome:
    - mixed
    - В командном чате обсуждение закрыто
    note: Чат показал, что комментарии под расписанием закрыты. Что происходит в других переписках, из этого сообщения узнать нельзя.
    review:
      signals:
      - observe/trener-vetku-pod-raspisaniem-zakryl
      effect: Чат показал, что комментарии под расписанием закрыты. Что происходит в других переписках, из этого сообщения узнать нельзя.
  observe-watch:
    mode: orange
    messages:
    - anya-asks-coach-about-dms
    - coach-confirms-contact
    outcome:
    - positive
    - Аня договорилась, куда писать при новых сообщениях
    note: Тренер подтвердил, что ты можешь написать ему лично. Про другие чаты он обещаний не давал.
    review:
      signals:
      - observe/trener-vetku-pod-raspisaniem-zakryl
      effect: Тренер подтвердил, что ты можешь написать ему лично. Про другие чаты он обещаний не давал.
  focus:
    mode: orange
    messages:
    - anya-asks-vera-to-stay
    - vera-stays-in-chat
    - trener-vetku-pod-raspisaniem-zakryl
    question: Под расписанием больше не пишут. Что тебе сейчас подходит?
    choices:
      focus-ease: В этой ветке больше не пишут. Можно отложить телефон.
      focus-watch: Скажу тренеру в личке, что мне уже приходили сообщения.
    review:
      signals:
      - pressure/vera-ya-uzhe-reshila-chto
      effect: Вера осталась с тобой на связи. Сообщение о закрытой ветке пришло от тренера в чате команды.
  focus-ease:
    mode: white
    messages:
    - sistema-kommentarii-pod-raspisaniem-zakryty
    outcome:
    - mixed
    - В командном чате обсуждение закрыто
    note: Чат показал, что комментарии под расписанием закрыты. Что происходит в других переписках, из этого сообщения узнать нельзя.
    review:
      signals:
      - focus/trener-vetku-pod-raspisaniem-zakryl
      effect: Чат показал, что комментарии под расписанием закрыты. Что происходит в других переписках, из этого сообщения узнать нельзя.
  focus-watch:
    mode: orange
    messages:
    - anya-asks-coach-about-dms
    - coach-confirms-contact
    outcome:
    - positive
    - Аня договорилась, куда писать при новых сообщениях
    note: Тренер подтвердил, что ты можешь написать ему лично. Про другие чаты он обещаний не давал.
    review:
      signals:
      - focus/trener-vetku-pod-raspisaniem-zakryl
      effect: Тренер подтвердил, что ты можешь написать ему лично. Про другие чаты он обещаний не давал.
  calm-watch:
    mode: white
    messages:
    - anya-takes-time
    - vera-agrees-to-pause
    outcome:
    - positive
    - Аня взяла паузу в переписке
    note: Вера сказала, что оставит скрин у себя. Аня могла выбрать, продолжать ли разговор сейчас.
cues:
  pressure/vera-ya-uzhe-reshila-chto: Вера назвала человека, который может закрыть обсуждение под расписанием.
  alternative/vera-ya-veryu-tebe-an: Вера предложила поговорить отдельно. Счётчик в общем чате не объясняет, откуда взялся скрин.
  observe/trener-vetku-pod-raspisaniem-zakryl: Тренер написал про одну ветку под расписанием и оставил возможность написать ему лично.
  focus/trener-vetku-pod-raspisaniem-zakryl: Тренер написал про одну ветку под расписанием и оставил возможность написать ему лично.
