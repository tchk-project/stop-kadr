scenes:
  start:
    mode: yellow
    messages:
    - kostya-glyan-skrin-pohodu-eto
    choices:
      pressure: Читать дальше
      calm: Спокойный дубль
  pressure:
    mode: yellow
    messages:
    - kostya-zakin-v-chat-komandy
    - anya-tim-ty-videl-chto
    continuation: true
    question: Костя просит переслать скрин. Что сделаешь?
    choices:
      pressure-act-0: Аня спрашивает, где выложили скрин. Напишу ей, что знаю.
      alternative: Одного куска мало. Спрошу в команде, кто видел остальное.
      pressure-act-1: Ане уже пишут гадости. Попрошу тренера проверить командный чат.
      ignore: Пока не отвечать Ане. Про скрин скоро забудут.
      observe: Пока никому не перешлю. Почитаю, что напишут в команде.
      focus: Отвечу Косте в личке, что не стану пересылать скрин.
  pressure-act-0:
    mode: orange
    messages:
    - ty-tam-odna-strochka-s
    - anya-teper-ponyala-pro-chto
    outcome:
    - positive
    - Аня узнала, от кого Тимур получил скрин
    note: Тимур назвал того, кто прислал ему скрин, и сказал, что места публикации не знает. Аня решила спросить Веру.
    review:
      signals:
      - pressure/kostya-zakin-v-chat-komandy
      - pressure/anya-tim-ty-videl-chto
      effect: Тимур назвал того, кто прислал ему скрин, и сказал, что места публикации не знает. Аня решила спросить Веру.
  pressure-act-1:
    mode: orange
    messages:
    - ty-pod-raspisaniem-igry-obsuzhdayut
    - trener-vizhu-vetku-zakroyu-otvety
    outcome:
    - positive
    - Тренер нашёл обсуждение под расписанием
    note: Тимур рассказал про скрин от Кости и про сообщения, о которых ему написала Аня. Обсуждение под расписанием нашёл тренер.
    review:
      signals:
      - pressure/kostya-zakin-v-chat-komandy
      - pressure/anya-tim-ty-videl-chto
      effect: Тимур рассказал про скрин от Кости и про сообщения, о которых ему написала Аня. Обсуждение под расписанием нашёл тренер.
  alternative:
    mode: orange
    messages:
    - ty-rebyat-pro-frazu-ani
    - sasha-a-chto-za-fraza
    - anya-teper-i-sasha-sprashivaet
    outcome:
    - negative
    - О скрине узнали ещё больше ребят
    note: Ты хотел проверить слух и даже не пересылал картинку. Но общий вопрос привлёк тех, кто ничего не слышал, и объяснений опять ждут от Ани. Про источник можно спросить лично. С оскорблениями уже может помочь модератор.
    review:
      signals:
      - pressure/kostya-zakin-v-chat-komandy
      - pressure/anya-tim-ty-videl-chto
      effect: Ты хотел проверить слух и даже не пересылал картинку. Но общий вопрос привлёк тех, кто ничего не слышал, и объяснений опять ждут от Ани. Про источник можно спросить лично. С оскорблениями уже может помочь модератор.
      miss: true
  ignore:
    mode: white
    messages:
    - anya-tim-mne-eschyo-dvoe
    question: Теперь ты знаешь ещё кое-что. Что сделаешь?
    choices:
      stay: Закрыть переписку и вернуться к ней завтра.
      rejoin: Сказать Ане, от кого пришёл скрин.
    review:
      miss: true
      signals:
      - pressure/kostya-zakin-v-chat-komandy
      - pressure/anya-tim-ty-videl-chto
      effect: 'После твоего решения разговор продолжился: «Тим, мне ещё двое написали. А тебе кто скрин прислал?»'
      repair: rejoin
      recovery: Аня получила ответ без новой пересылки.
  stay:
    mode: white
    messages:
    - anya-vera-mne-pokazala-tam
    outcome:
    - mixed
    - Вера нашла обсуждение
    note: Тимур не ответил, от кого получил скрин. Позже Аня написала ему, где Вера нашла обсуждение.
    review:
      miss: true
      signals:
      - ignore/anya-tim-mne-eschyo-dvoe
      effect: Тимур не ответил, от кого получил скрин. Позже Аня написала ему, где Вера нашла обсуждение.
  rejoin:
    mode: orange
    messages:
    - ty-odna-fraza-s-nimi
    - anya-teper-ponyala-sam-skrin
    outcome:
    - positive
    - Аня получила ответ без новой пересылки
    note: Тимур сказал, от кого получил скрин. Аня поблагодарила его за то, что он не стал его пересылать.
  calm:
    mode: yellow
    messages:
    - kostya-stop-tut-zhe-odna
    continuation: true
    question: Как продолжишь?
    choices:
      calm-end: Посмотреть, что будет дальше
      ask: Переспросить про источник
      calm-watch: Дочитаю, кому Костя уже отправил скрин.
  calm-end:
    mode: yellow
    messages:
    - kostya-ya-poka-tol-ko-tebe
    outcome:
    - positive
    - Скрин дальше не переслали
    note: По одной фразе никто не смог определить, о ком шла речь. В этой переписке скрин перестали пересылать.
  ask:
    mode: orange
    messages:
    - ty-ty-videl-soobscheniya-do
    - kostya-net-mne-uzhe-tak
    outcome:
    - positive
    - Костя получил уже обрезанную картинку
    note: Происхождение картинки ещё предстоит выяснить. Для этого не пришлось посылать её всей команде.
  observe:
    mode: yellow
    messages:
    - trener-vetku-pod-raspisaniem-zakryl
    question: Тренер закрыл ветку под расписанием. Что дальше?
    choices:
      observe-ease: В этой ветке больше не пишут. Можно отложить телефон.
      observe-watch: Напишу Ане, какую ветку закрыл тренер.
    review:
      signals:
      - pressure/kostya-zakin-v-chat-komandy
      - pressure/anya-tim-ty-videl-chto
      effect: Тренер закрыл конкретное обсуждение. Что происходит в других чатах, пока неизвестно.
  observe-ease:
    mode: yellow
    messages:
    - sistema-kommentarii-pod-raspisaniem-zakryty
    outcome:
    - mixed
    - В командном чате обсуждение закрыто
    note: Тренер закрыл конкретное обсуждение. Что происходит в других чатах, пока неизвестно.
    review:
      signals:
      - observe/trener-vetku-pod-raspisaniem-zakryl
      effect: Тренер закрыл конкретное обсуждение. Что происходит в других чатах, пока неизвестно.
  observe-watch:
    mode: orange
    messages:
    - timur-tells-anya-about-thread
    - anya-thanks-for-private-message
    outcome:
    - positive
    - Аня узнала, где закрыли комментарии
    note: Ты передал Ане то, что сообщил тренер. Скрин для этого пересылать не пришлось.
    review:
      signals:
      - observe/trener-vetku-pod-raspisaniem-zakryl
      effect: Ты передал Ане то, что сообщил тренер. Скрин для этого пересылать не пришлось.
  focus:
    mode: orange
    messages:
    - timur-declines-forward
    - trener-vetku-pod-raspisaniem-zakryl
    question: Тренер закрыл ветку под расписанием. Что дальше?
    choices:
      focus-ease: В этой ветке больше не пишут. Можно отложить телефон.
      focus-watch: Напишу Ане, какую ветку закрыл тренер.
    review:
      signals:
      - pressure/kostya-zakin-v-chat-komandy
      - pressure/anya-tim-ty-videl-chto
      effect: Ты ответил только Косте. Затем в командном чате тренер сам объявил о закрытии ветки.
  focus-ease:
    mode: yellow
    messages:
    - sistema-kommentarii-pod-raspisaniem-zakryty
    outcome:
    - mixed
    - В командном чате обсуждение закрыто
    note: Тренер закрыл конкретное обсуждение. Что происходит в других чатах, пока неизвестно.
    review:
      signals:
      - focus/trener-vetku-pod-raspisaniem-zakryl
      effect: Тренер закрыл конкретное обсуждение. Что происходит в других чатах, пока неизвестно.
  focus-watch:
    mode: orange
    messages:
    - timur-tells-anya-about-thread
    - anya-thanks-for-private-message
    outcome:
    - positive
    - Аня узнала, где закрыли комментарии
    note: Ты передал Ане то, что сообщил тренер. Скрин для этого пересылать не пришлось.
    review:
      signals:
      - focus/trener-vetku-pod-raspisaniem-zakryl
      effect: Ты передал Ане то, что сообщил тренер. Скрин для этого пересылать не пришлось.
  calm-watch:
    mode: orange
    messages:
    - kostya-ya-poka-tol-ko-tebe
    outcome:
    - positive
    - Скрин дальше не переслали
    note: По одной фразе никто не смог определить, о ком шла речь. В этой переписке скрин перестали пересылать.
cues:
  pressure/kostya-zakin-v-chat-komandy: Костя хочет переслать обрезанный скрин от твоего имени.
  pressure/anya-tim-ty-videl-chto: Аня сама рассказала тебе, что получает сообщения.
  ignore/anya-tim-mne-eschyo-dvoe: Теперь к тебе обратились напрямую.
  observe/trener-vetku-pod-raspisaniem-zakryl: Тренер закрыл конкретное обсуждение. Что происходит в других чатах, пока неизвестно.
  focus/trener-vetku-pod-raspisaniem-zakryl: Тренер закрыл конкретное обсуждение. Что происходит в других чатах, пока неизвестно.
