scenes:
  start:
    mode: yellow
    messages:
    - vera-anya-otoshla-k-stene
    - remarka-so-svoego-mesta-ty
    choices:
      pressure: Читать дальше
      calm: Спокойный дубль
  pressure:
    mode: yellow
    messages:
    - anya-ya-emu-dvazhdy-skazala
    continuation: true
    question: Аня пишет, что хочет к вам за стол. Что ты сделаешь?
    choices:
      pressure-act-0: Напишу Ане, что рядом со мной свободно.
      pressure-act-1: Спрошу у Ани в личке, встретить ли её.
      alternative: Предложу всё-таки станцевать с Лёшей один раз.
      ignore: Отложу телефон, вернусь к музыке.
      observe: Молча подвину для неё свободный стул.
      focus: Помашу Ане, чтобы она увидела свободное место.
  pressure-act-0:
    mode: orange
    messages:
    - ty-an-idi-syuda-ryadom
    - remarka-ty-sdvigaesh-stul-ya-chtoby
    - anya-spasibo-mozhno-ya-poka
    - ty-konechno
    outcome:
    - positive
    - Аня сидит рядом с тобой
    note: Аня попросилась к вам за стол. Ты освободил ей место, и ей не пришлось заново объяснять свой отказ от танца.
    review:
      signals:
      - pressure/anya-ya-emu-dvazhdy-skazala
      effect: Аня попросилась к вам за стол. Ты освободил ей место, и ей не пришлось заново объяснять свой отказ от танца.
  pressure-act-1:
    mode: orange
    messages:
    - ty-konechno-hochesh-podoydu-za
    - anya-da-ya-sama-doydu
    - ty-derzhu-my-u-kolonki
    outcome:
    - positive
    - Ты придержал Ане место
    note: Аня хотела сама дойти до стола. Ты услышал её ответ и предложил ровно то, что пригодилось.
    review:
      signals:
      - pressure/anya-ya-emu-dvazhdy-skazala
      effect: Аня хотела сама дойти до стола. Ты услышал её ответ и предложил ровно то, что пригодилось.
  alternative:
    mode: yellow
    messages:
    - ty-mozhet-odin-raz-potantsuesh
    - anya-ya-prosto-sprosila-mozhno
    - vera-ona-uzhe-v-garderob
    outcome:
    - negative
    - Аня ушла в гардероб
    note: Аня попросила о месте рядом и в ответ услышала ещё один уговор. От Веры ты узнал, что Аня пошла в гардероб. Можно подойти и сказать «Место рядом с нами твоё, если захочешь».
    review:
      signals:
      - pressure/anya-ya-emu-dvazhdy-skazala
      effect: Аня попросила о месте рядом и в ответ услышала ещё один уговор. От Веры ты узнал, что Аня пошла в гардероб. Можно подойти и сказать «Место рядом с нами твоё, если захочешь».
      miss: true
  ignore:
    mode: white
    messages:
    - anya-dan-tam-stul-eschyo
    question: Аня не слышит тебя из-за музыки. Как ответишь про стул?
    choices:
      stay: Вернуться к музыке, посмотреть потом.
      rejoin: Помахать Ане и освободить стул.
    review:
      miss: true
      signals:
      - pressure/anya-ya-emu-dvazhdy-skazala
      effect: Аня ищет место за вашим столом. Из-за музыки ответ до неё может не дойти.
      repair: rejoin
      recovery: Аня знает, где её ждут.
  stay:
    mode: white
    messages:
    - anya-ya-uzhe-s-veroy
    outcome:
    - mixed
    - Аня ушла к Вере, не дождавшись ответа
    note: Аня нашла компанию Веры сама. Она так и не узнала, оставили ли ей место за столом.
    review:
      miss: true
      signals:
      - ignore/anya-dan-tam-stul-eschyo
      effect: Аня нашла компанию Веры сама. Она так и не узнала, оставили ли ей место за столом.
  rejoin:
    mode: orange
    messages:
    - ty-an-syuda-stul-svoboden
    - anya-o-vizhu-seychas-podoydu
    outcome:
    - positive
    - Аня знает, где её ждут
    note: Даня обозначил свободный стул. Теперь Аня сама может к нему подойти.
  calm:
    mode: yellow
    messages:
    - vera-my-za-vodoy-anya
    - remarka-lyosha-tantsuet-v-krugu
    continuation: true
    question: Как продолжишь?
    choices:
      calm-end: Послушаю, что сейчас поставят.
      ask: Попрошу Веру взять и мне воды.
      calm-watch: Покажу Вере, что у меня уже есть вода.
  calm-end:
    mode: yellow
    messages:
    - remarka-anya-i-vera-berut
    outcome:
    - positive
    - Аня провела эту песню с Верой
    note: Аня пошла за водой с Верой. Лёша занялся танцами.
  ask:
    mode: yellow
    messages:
    - ty-aga-spasibo-ya-zdes
    - vera-vizhu-tebya
    outcome:
    - positive
    - Вера знает, где ждёт Даня
    note: Вера спросила про воду. Со своего места Даня видит, что Аня идёт с ней, а Лёша танцует у сцены.
  observe:
    mode: yellow
    messages:
    - remark-danya-chair
    - remarka-vera-i-anya-podhodyat
    - anya-spasibo-posizhu-s-vami
    question: Аня подошла с Верой. Как поступишь?
    choices:
      observe-ease: Освобожу край стола и вернусь к разговору о музыке.
      observe-watch: Тихо спрошу Аню, посидеть ли с ней.
    review:
      signals:
      - pressure/anya-ya-emu-dvazhdy-skazala
      effect: Ты освободил место. На сообщение Ани ты не ответил. Когда она подошла с Верой, стул был свободен.
  observe-ease:
    mode: yellow
    messages:
    - remark-danya-space
    - remarka-za-stolom-slyshno-kak
    outcome:
    - positive
    - Для Ани нашлось место за столом
    note: Ты подвинул вещи. Аня смогла сесть с вами и послушать музыку.
    review:
      signals:
      - observe/anya-spasibo-posizhu-s-vami
      effect: Ты подвинул вещи. Аня смогла сесть с вами и послушать музыку.
  observe-watch:
    mode: orange
    messages:
    - danya-stay-near
    - anya-stay-near
    outcome:
    - positive
    - Аня попросила Даню остаться и сменила тему
    note: Ты спросил Аню, нужна ли компания. Она согласилась и сама заговорила о музыке.
    review:
      signals:
      - observe/anya-spasibo-posizhu-s-vami
      effect: Ты спросил Аню, нужна ли компания. Она согласилась и сама заговорила о музыке.
  focus:
    mode: orange
    messages:
    - remark-danya-waves
    - remarka-vera-i-anya-podhodyat
    - anya-spasibo-posizhu-s-vami
    question: Аня подошла с Верой. Как поступишь?
    choices:
      focus-ease: Освобожу край стола и вернусь к разговору о музыке.
      focus-watch: Тихо спрошу Аню, посидеть ли с ней.
    review:
      signals:
      - pressure/anya-ya-emu-dvazhdy-skazala
      effect: Ты показал, куда идти. Аня помахала в ответ и подошла с Верой.
  focus-ease:
    mode: yellow
    messages:
    - remark-danya-space
    - remarka-za-stolom-slyshno-kak
    outcome:
    - positive
    - Для Ани нашлось место за столом
    note: Ты подвинул вещи. Аня смогла сесть с вами и послушать музыку.
    review:
      signals:
      - focus/anya-spasibo-posizhu-s-vami
      effect: Ты подвинул вещи. Аня смогла сесть с вами и послушать музыку.
  focus-watch:
    mode: orange
    messages:
    - danya-stay-near
    - anya-stay-near
    outcome:
    - positive
    - Аня попросила Даню остаться и сменила тему
    note: Ты спросил Аню, нужна ли компания. Она согласилась и сама заговорила о музыке.
    review:
      signals:
      - focus/anya-spasibo-posizhu-s-vami
      effect: Ты спросил Аню, нужна ли компания. Она согласилась и сама заговорила о музыке.
  calm-watch:
    mode: yellow
    messages:
    - danya-shows-bottle
    outcome:
    - positive
    - Вера взяла воду на двоих
    note: Даня ответил жестом. Вера его увидела и поняла, сколько нужно стаканов.
cues:
  pressure/anya-ya-emu-dvazhdy-skazala: Даня не слышал разговора у стены. Сейчас Аня сама говорит, чего хочет.
  ignore/anya-dan-tam-stul-eschyo: Аня спросила о конкретном месте за вашим столом.
  observe/anya-spasibo-posizhu-s-vami: Аня уже подошла и сама сказала, что хочет посидеть с вами.
  focus/anya-spasibo-posizhu-s-vami: Аня уже подошла и сама сказала, что хочет посидеть с вами.
