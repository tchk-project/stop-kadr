scenes:
  start:
    mode: yellow
    messages:
    - lyosha-potantsuem
    - ty-spasibo-ya-posizhu
    choices:
      pressure: Читать дальше
      calm: Спокойный дубль
  pressure:
    mode: yellow
    messages:
    - lyosha-nu-odin-tanets-i
    - ty-ya-skazala-chto-ne
    - remarka-ty-othodish-k-stene
    continuation: true
    question: Лёша держит тебя за руку. Что сделаешь?
    choices:
      alternative: Хочу, чтобы меня отпустили. Попробую переключить его внимание на Веру.
      pressure-act-0: Лёша держит меня за руку. Попрошу Веру привести дежурную.
      pressure-act-1: Мне не дают отойти. Позову дежурную у двери.
      observe: Окликну Веру. Хочу к ребятам за стол.
      focus: Поймаю взгляд Веры и поманю её свободной рукой.
  pressure-act-0:
    mode: red
    messages:
    - ty-vera-pomogi-menya-derzhat
    - remarka-dezhurnaya-podhodit-lyosha-otpuskaet
    - vera-ya-tvoyu-kurtku-vzyala
    - ty-davay-posidim-tantsevat-uzhe
    outcome:
    - positive
    - Лёша отпустил руку. Вера рядом
    note: Вера услышала просьбу, и дежурная помогла. Даже когда ты в безопасности, настроение не обязано тут же вернуться. Ты можешь остаться с Верой и решить, чего хочется дальше.
    review:
      signals:
      - pressure/remarka-ty-othodish-k-stene
      effect: Вера услышала просьбу, и дежурная помогла. Даже когда ты в безопасности, настроение не обязано тут же вернуться. Ты можешь остаться с Верой и решить, чего хочется дальше.
  pressure-act-1:
    mode: red
    messages:
    - ty-marina-sergeevna-pomogite
    - marina-sergeevna-ya-zdes-lyosha
    - remarka-lyosha-otpuskaet-ruku-vera
    - vera-zdes-postoim-ili-k
    - ty-k-nashim-ya-dane
    outcome:
    - positive
    - Лёша отпустил руку. Ты можешь уйти к друзьям
    note: Марина Сергеевна услышала и подошла. Ты смогла отойти и выбрать, где тебе сейчас спокойнее.
    review:
      signals:
      - pressure/remarka-ty-othodish-k-stene
      effect: Марина Сергеевна услышала и подошла. Ты смогла отойти и выбрать, где тебе сейчас спокойнее.
  alternative:
    mode: orange
    messages:
    - ty-lyosh-otpusti-von-vera
    - remarka-lyosha-otpuskaet-tvoyu-ruku
    - vera-ya-k-tebe-podoshla
    - remarka-vy-sadites-u-steny
    question: Что тебе сейчас подходит?
    choices:
      follow-up: Предложить Вере вместе подойти к дежурной
      pause: Побуду с Верой у стены.
    review:
      signals:
      - pressure/remarka-ty-othodish-k-stene
      effect: За то, что Лёша тебя держал, отвечает он. Желание поскорее освободиться понятно. Когда ты предложила Веру, ей тоже пришлось отказываться. Ей можно прямо сказать, какая помощь тебе нужна, например попросить позвать дежурную.
      miss: false
  follow-up:
    mode: red
    messages:
    - ty-ver-poydyosh-so-mnoy
    - vera-poydyom-ya-videla-mogu
    outcome:
    - positive
    - Аня и Вера пошли к дежурной
    note: Вера сама видела, как Лёша держал Аню. Она согласилась вместе подойти к дежурной.
    review:
      signals:
      - alternative/vera-ya-k-tebe-podoshla
      effect: Вера сама видела, как Лёша держал Аню. Она согласилась вместе подойти к дежурной.
  pause:
    mode: orange
    messages:
    - remarka-na-etom-dubl-zakanchivaetsya
    outcome:
    - open
    - Лёша отпустил руку. Вы с Верой сидите рядом
    note: Можно посидеть с Верой. Ты хотела, чтобы Лёша отпустил руку. Он отпустил тебя, а потом позвал Веру, и она тоже отказалась. Когда заговорить об этом, каждая из вас решает сама.
    review:
      signals:
      - alternative/vera-ya-k-tebe-podoshla
      effect: Можно взять паузу. Решать, возвращаться ли к этому разговору, по-прежнему тебе.
  calm:
    mode: yellow
    messages:
    - lyosha-ladno-ya-togda-k
    - vera-an-ya-za-vodoy
    continuation: true
    question: Как продолжишь?
    choices:
      calm-end: Схожу с Верой за водой.
      ask: Позвать Веру посидеть рядом
      calm-watch: Возьму воды и посижу. Хочу послушать эту песню.
  calm-end:
    mode: yellow
    messages:
    - remarka-anya-i-vera-berut
    outcome:
    - positive
    - Аня провела эту песню с Верой
    note: Аня и Вера пошли за водой. Лёша сказал, что пойдёт к ребятам.
  ask:
    mode: yellow
    messages:
    - ty-davay-potom-za-stol
    - vera-davay-tam-dva-stula
    outcome:
    - positive
    - Вера согласилась посидеть с Аней
    note: Аня и Вера сами договорились, что делать дальше. Уговаривать Аню никто не стал.
  observe:
    mode: orange
    messages:
    - ty-ver-syuda-pozhaluysta
    - remarka-vera-podhodit-lyosha-otpuskaet
    - vera-ya-s-toboy-poydyom
    question: Вера зовёт тебя за стол. Чего тебе сейчас хочется?
    choices:
      observe-ease: Пойду к ребятам и послушаю музыку.
      observe-watch: Попрошу Веру посидеть рядом со мной.
    review:
      signals:
      - pressure/remarka-ty-othodish-k-stene
      effect: Ты окликнула Веру. Она подошла, Лёша отпустил руку, и теперь ты можешь уйти с ней.
  observe-ease:
    mode: yellow
    messages:
    - anya-lets-sit
    - remarka-za-stolom-slyshno-kak
    outcome:
    - positive
    - Аня вернулась к музыке
    note: Лёша отошёл. Ты выбрала побыть с друзьями за столом.
    review:
      signals:
      - observe/remarka-vera-podhodit-lyosha-otpuskaet
      effect: Лёша отошёл. Ты выбрала побыть с друзьями за столом.
  observe-watch:
    mode: orange
    messages:
    - anya-ask-vera
    - vera-stays
    outcome:
    - positive
    - Вера согласилась посидеть рядом с Аней
    note: Ты попросила Веру остаться с тобой. Она услышала, чего тебе сейчас хочется.
    review:
      signals:
      - observe/remarka-vera-podhodit-lyosha-otpuskaet
      effect: Ты попросила Веру остаться с тобой. Она услышала, чего тебе сейчас хочется.
  focus:
    mode: red
    messages:
    - remark-anya-wave
    - remarka-vera-podhodit-lyosha-otpuskaet
    - vera-ya-s-toboy-poydyom
    question: Вера зовёт тебя за стол. Чего тебе сейчас хочется?
    choices:
      focus-ease: Пойду к ребятам и послушаю музыку.
      focus-watch: Попрошу Веру посидеть рядом со мной.
    review:
      signals:
      - pressure/remarka-ty-othodish-k-stene
      effect: Вера заметила твой жест и подошла. Лёша отпустил руку. Ты можешь выбрать, где побыть дальше.
  focus-ease:
    mode: yellow
    messages:
    - anya-lets-sit
    - remarka-za-stolom-slyshno-kak
    outcome:
    - positive
    - Аня вернулась к музыке
    note: Лёша отошёл. Ты выбрала побыть с друзьями за столом.
    review:
      signals:
      - focus/remarka-vera-podhodit-lyosha-otpuskaet
      effect: Лёша отошёл. Ты выбрала побыть с друзьями за столом.
  focus-watch:
    mode: orange
    messages:
    - anya-ask-vera
    - vera-stays
    outcome:
    - positive
    - Вера согласилась посидеть рядом с Аней
    note: Ты попросила Веру остаться с тобой. Она услышала, чего тебе сейчас хочется.
    review:
      signals:
      - focus/remarka-vera-podhodit-lyosha-otpuskaet
      effect: Ты попросила Веру остаться с тобой. Она услышала, чего тебе сейчас хочется.
  calm-watch:
    mode: white
    messages:
    - anya-listens-to-music
    outcome:
    - positive
    - Аня устроилась послушать музыку
    note: Лёша принял твой отказ. У стола ты отдохнула и послушала песню.
cues:
  pressure/remarka-ty-othodish-k-stene: Лёша удерживает тебя после отказа. Вера и дежурная рядом.
  alternative/vera-ya-k-tebe-podoshla: Вера объяснила, зачем подошла. Она тоже не хотела танцевать.
  observe/remarka-vera-podhodit-lyosha-otpuskaet: Аня может отойти к друзьям. Лёша остался у колонок.
  focus/remarka-vera-podhodit-lyosha-otpuskaet: Аня может отойти к друзьям. Лёша остался у колонок.
