vera-anya-otoshla-k-stene:
  speaker: Вера
  aside: лично тебе
  channel: lichnaya-perepiska-s-veroy
  text: Аня отошла к стене. Я к ней, сейчас вернусь.
remarka-so-svoego-mesta-ty:
  speaker: Ремарка
  channel: scene
  caption: У стола
  text: Со своего места ты видишь, как Лёша отходит от Ани. Из-за музыки не слышно, что они сказали друг другу.
anya-ya-emu-dvazhdy-skazala:
  speaker: Аня
  aside: тебе
  channel: lichnaya-perepiska-s-aney
  text: Я ему дважды сказала, что не хочу танцевать. [[Можно я с вами посижу]]?
ty-an-idi-syuda-ryadom:
  speaker: Ты
  channel: lichnaya-perepiska-s-aney
  text: Ань, иди сюда. Рядом со мной свободно.
remarka-ty-sdvigaesh-stul-ya-chtoby:
  speaker: Ремарка
  channel: scene
  caption: У стола
  text: Ты сдвигаешь стулья, чтобы Аня смогла пройти к столу.
anya-spasibo-mozhno-ya-poka:
  speaker: Аня
  text: Спасибо. Можно я пока просто посижу?
ty-konechno:
  speaker: Ты
  text: Конечно.
ty-konechno-hochesh-podoydu-za:
  speaker: Ты
  channel: lichnaya-perepiska-s-aney
  text: Конечно. Хочешь, подойду за тобой?
anya-da-ya-sama-doydu:
  speaker: Аня
  text: Да я сама дойду. Место подержи, ладно?
ty-derzhu-my-u-kolonki:
  speaker: Ты
  text: Держу. Мы у колонки.
ty-mozhet-odin-raz-potantsuesh:
  speaker: Ты
  text: Может, один раз потанцуешь, и он успокоится? Потом сядешь с нами.
anya-ya-prosto-sprosila-mozhno:
  speaker: Аня
  text: Я просто спросила, можно ли к вам за стол.
vera-ona-uzhe-v-garderob:
  speaker: Вера
  channel: scene
  caption: У стола · разговор с Верой
  text: Она уже в гардероб пошла. А я ей место держала.
anya-dan-tam-stul-eschyo:
  speaker: Аня
  channel: lichnaya-perepiska-s-aney
  text: '[[Дань, там стул ещё есть? Я из-за музыки не слышу.]]'
anya-ya-uzhe-s-veroy:
  speaker: Аня
  channel: lichnaya-perepiska-s-aney
  text: Я уже с Верой в гардеробе. До завтра.
ty-an-syuda-stul-svoboden:
  speaker: Ты
  channel: scene
  caption: У стола
  text: Ань, сюда! Стул свободен.
anya-o-vizhu-seychas-podoydu:
  speaker: Аня
  text: О, вижу. Сейчас подойду.
vera-my-za-vodoy-anya:
  speaker: Вера
  channel: lichnaya-perepiska-s-veroy
  text: Мы за водой. Аня спрашивает, тебе тоже взять?
remarka-lyosha-tantsuet-v-krugu:
  speaker: Ремарка
  channel: scene
  caption: У стола
  text: Лёша танцует в кругу у сцены. Аня и Вера идут к столу с водой.
remarka-anya-i-vera-berut:
  speaker: Ремарка
  text: Аня и Вера берут воду. У стола слышно, какую песню поставили следующей.
ty-aga-spasibo-ya-zdes:
  speaker: Ты
  channel: lichnaya-perepiska-s-veroy
  text: Ага, спасибо. Я здесь, у колонки.
vera-vizhu-tebya:
  speaker: Вера
  text: Вижу тебя.
remarka-vera-i-anya-podhodyat:
  speaker: Ремарка
  channel: scene
  caption: У стола
  text: Вера и Аня подходят к столу. Лёша остаётся у колонок.
anya-spasibo-posizhu-s-vami:
  speaker: Аня
  text: Спасибо, [[посижу с вами]].
remarka-za-stolom-slyshno-kak:
  speaker: Ремарка
  text: За столом слышно, как меняется песня. Вера остаётся рядом.
lyosha-potantsuem:
  speaker: Лёша
  text: Потанцуем?
ty-spasibo-ya-posizhu:
  speaker: Ты
  text: Спасибо, я посижу.
lyosha-nu-odin-tanets-i:
  speaker: Лёша
  text: Ну один танец, и всё.
ty-ya-skazala-chto-ne:
  speaker: Ты
  text: Я сказала, что не хочу.
remarka-ty-othodish-k-stene:
  speaker: Ремарка
  text: Ты отходишь к стене. Лёша [[берёт тебя за запястье]]. Вера подходит, Марина Сергеевна дежурит у двери.
ty-vera-pomogi-menya-derzhat:
  speaker: Ты
  text: Вера, помоги, меня держат. Позови дежурную.
remarka-dezhurnaya-podhodit-lyosha-otpuskaet:
  speaker: Ремарка
  text: Дежурная подходит. Лёша отпускает руку и отходит.
vera-ya-tvoyu-kurtku-vzyala:
  speaker: Вера
  text: Я твою куртку взяла. Хочешь домой или пока посидим?
ty-davay-posidim-tantsevat-uzhe:
  speaker: Ты
  text: Давай посидим. Танцевать уже не хочется.
ty-marina-sergeevna-pomogite:
  speaker: Ты
  text: Марина Сергеевна, помогите!
marina-sergeevna-ya-zdes-lyosha:
  speaker: Марина Сергеевна
  text: Я здесь. Лёша, отпусти Аню.
remarka-lyosha-otpuskaet-ruku-vera:
  speaker: Ремарка
  text: Лёша отпускает руку. Вера остаётся с тобой у стены.
vera-zdes-postoim-ili-k:
  speaker: Вера
  text: Здесь постоим или к нашим?
ty-k-nashim-ya-dane:
  speaker: Ты
  text: К нашим. Я Дане напишу.
ty-lyosh-otpusti-von-vera:
  speaker: Ты
  text: Лёш, отпусти. Вон Вера, может, с ней потанцуешь?
remarka-lyosha-otpuskaet-tvoyu-ruku:
  speaker: Ремарка
  text: Лёша отпускает твою руку и зовёт Веру.
vera-ya-k-tebe-podoshla:
  speaker: Вера
  aside: тебе
  text: Я к тебе подошла, потому что видела, как он тебя держит. [[Я тоже с ним не хочу]].
remarka-vy-sadites-u-steny:
  speaker: Ремарка
  text: Вы садитесь у стены. Вместо разговора о музыке вы обе следите, куда он ушёл.
ty-ver-poydyosh-so-mnoy:
  speaker: Ты
  text: Вер, пойдёшь со мной к Марине Сергеевне? Хочу сказать, что он меня держал.
vera-poydyom-ya-videla-mogu:
  speaker: Вера
  text: Пойдём. Я видела, могу с тобой остаться.
remarka-na-etom-dubl-zakanchivaetsya:
  speaker: Ремарка
  text: На этом дубль заканчивается.
lyosha-ladno-ya-togda-k:
  speaker: Лёша
  text: Ладно. Я тогда к ребятам.
vera-an-ya-za-vodoy:
  speaker: Вера
  text: Ань, я за водой. Со мной?
ty-davay-potom-za-stol:
  speaker: Ты
  text: Давай. Потом за стол? Я ноги уже не чувствую.
vera-davay-tam-dva-stula:
  speaker: Вера
  text: Давай, там два стула.
ty-ver-syuda-pozhaluysta:
  speaker: Ты
  text: Вер, сюда, пожалуйста!
remarka-vera-podhodit-lyosha-otpuskaet:
  speaker: Ремарка
  text: Вера подходит. [[Лёша отпускает тебя]] и отходит к колонкам.
vera-ya-s-toboy-poydyom:
  speaker: Вера
  text: Я с тобой. Пойдём за стол?
