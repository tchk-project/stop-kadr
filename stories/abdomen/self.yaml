scenes:
  start:
    mode: yellow
    messages:
    - misha-tim-u-nas-eschyo
    - timur-minut-desyat-ty-chego
    choices:
      pressure: Продолжить
      calm: Спокойный дубль
  calm:
    mode: yellow
    messages:
    - misha-shnurok-v-uzel-zatyanulsya
    - timur-derzhi-manishku-ya-tvoyu
    continuation: true
    question: Что дальше?
    choices:
      calm-end: Возьму у Тимура манишку и пойду с ним на поле.
  calm-end:
    mode: yellow
    messages:
    - remarka-rebyata-dognali-komandu-u
    outcome:
    - positive
    - Успели вместе
    note: В этом дубле оба хорошо себя чувствуют.
  pressure:
    mode: yellow
    messages:
    - misha-s-utra-u-pupka
    - remarka-misha-probuet-vstat-i
    - misha-tol-ko-treneru-ne-govori
    continuation: true
    question: Что ты сделаешь сейчас?
    choices:
      call: «Тим, всё-таки вызови скорую. Я здесь посижу».
      wait: Попросить Тимура подождать до свистка. Вдруг отпустит?
  wait:
    mode: yellow
    messages:
    - self-waits
    - remarka-misha-boitsya-propustit-igru
    - remarka-sil-naya-narastayuschaya-bol-v
    question: Что сделаешь теперь?
    choices:
      call-now: «Тим, всё-таки вызови скорую. Я здесь посижу».
    review:
      signals:
      - pressure/misha-s-utra-u-pupka
      - pressure/misha-tol-ko-treneru-ne-govori
      miss: true
      effect: Вызов отложили, хотя признаки уже были видны.
      repair: call-now
      recovery: Потом ты попросил Тимура позвонить. Он остался с тобой.
  call:
    mode: red
    messages:
    - self-asks-before-call
    - remarka-timur-nabiraet-103-i
    - timur-my-u-razdevalki-shkol-nogo
    - dispetcher-chto-sluchilos
    question: Что подскажешь, пока идёт звонок?
    choices:
      call-report: Тим, скажи, что сначала болело у пупка, а теперь справа внизу. Мне даже встать больно.
    review:
      signals:
      - pressure/misha-s-utra-u-pupka
      effect: Диспетчер принял звонок и узнал, куда ехать.
  call-report:
    mode: red
    messages:
    - ty-tim-skazhi-chto-snachala
    - timur-mishe-15-let-on
    - dispetcher-brigada-napravlena-ostavaytes-na
    - remarka-trener-podhodit
    - timur-vstrette-u-kalitki
    - remarka-timur-ostayotsya-s-mishey
    outcome:
    - positive
    - Скорую вызвали
    note: Сильная нарастающая боль в животе требует экстренной оценки. Так может проявляться аппендицит. Даже если место боли другое, сильная боль сама по себе — повод вызвать скорую. В России звонят 103 или 112. Рядом с тобой есть человек, который остаётся на связи с диспетчером.
    review:
      signals:
      - call/dispetcher-chto-sluchilos
      effect: Диспетчер услышал, что изменилось и когда это началось.
  call-now:
    mode: red
    messages:
    - self-asks-before-call
    - remarka-timur-nabiraet-103-i
    - timur-my-u-razdevalki-shkol-nogo
    - dispetcher-chto-sluchilos
    question: Что подскажешь, пока идёт звонок?
    choices:
      call-now-report: Тим, скажи, что сначала болело у пупка, а теперь справа внизу. Мне даже встать больно.
    review:
      signals:
      - wait/remarka-misha-boitsya-propustit-igru
      effect: Диспетчер принял звонок и узнал, куда ехать.
  call-now-report:
    mode: red
    messages:
    - ty-tim-skazhi-chto-snachala
    - timur-mishe-15-let-on
    - dispetcher-brigada-napravlena-ostavaytes-na
    - remarka-trener-podhodit
    - timur-vstrette-u-kalitki
    - remarka-timur-ostayotsya-s-mishey
    outcome:
    - positive
    - Скорую вызвали
    note: Сильная нарастающая боль в животе требует экстренной оценки. Так может проявляться аппендицит. Даже если место боли другое, сильная боль сама по себе — повод вызвать скорую. В России звонят 103 или 112. Рядом с тобой есть человек, который остаётся на связи с диспетчером.
    review:
      signals:
      - call-now/dispetcher-chto-sluchilos
      effect: Диспетчер услышал, что изменилось и когда это началось.
cues:
  pressure/misha-s-utra-u-pupka: Сильная нарастающая боль в животе требует экстренной оценки. Так может проявляться аппендицит. Даже если место боли другое, сильная боль сама по себе — повод вызвать скорую.
  pressure/misha-tol-ko-treneru-ne-govori: Миша боится пропустить игру. Он по-прежнему с трудом встаёт.
  wait/remarka-misha-boitsya-propustit-igru: Сильная нарастающая боль в животе требует экстренной оценки. Так может проявляться аппендицит. Даже если место боли другое, сильная боль сама по себе — повод вызвать скорую.
  call/dispetcher-chto-sluchilos: Диспетчеру нужны признаки, которые можно описать своими словами.
  call-now/dispetcher-chto-sluchilos: Диспетчеру нужны признаки, которые можно описать своими словами.
