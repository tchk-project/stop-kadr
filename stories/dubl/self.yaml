scenes:
  start:
    mode: yellow
    messages:
    - vera-u-kogo-video-s
    - misha-est-eschyo-dubl-gde
    - kostya-ahaha-a-v-shkol-nyy
    - misha-kost-etot-v-shkol-nyy
    choices:
      pressure: Читать дальше
      calm: Спокойный дубль
  pressure:
    mode: yellow
    messages:
    - kostya-davayte-golosovat-kto-za
    continuation: true
    question: Твою запись вынесли на голосование. Что тебе удобнее?
    choices:
      pressure-act-0: Опрос идёт после моего отказа. Напишу админу.
      pressure-act-1: Я уже ответил. Выключу звук и побуду с Верой.
      alternative: Отложу телефон до конца репетиции. Позже проверю опрос.
      observe: Останусь в чате и дождусь следующего сообщения Кости.
      focus: Напишу Косте прямо под опросом, что мой ответ прежний.
  pressure-act-0:
    mode: orange
    messages:
    - ty-ver-mozhesh-snyat-opros
    - vera-da-u-menya-est
    - sistema-vera-zakryla-opros
    outcome:
    - positive
    - Вера закрыла голосование
    note: Вера смогла закрыть опрос в вашей группе. Ты сам выбрал, к кому обратиться.
    review:
      signals:
      - start/misha-kost-etot-v-shkol-nyy
      - pressure/kostya-davayte-golosovat-kto-za
      effect: Вера смогла закрыть опрос в вашей группе. Ты сам выбрал, к кому обратиться.
  pressure-act-1:
    mode: orange
    messages:
    - ty-ver-mozhno-ya-k
    - vera-konechno-ya-u-kabineta
    - remarka-ty-vyklyuchaesh-zvuk-u
    outcome:
    - positive
    - Миша взял паузу и нашёл компанию
    note: Миша взял паузу и договорился о встрече. Его просьба оставить запись в группе всё ещё в силе.
    review:
      signals:
      - start/misha-kost-etot-v-shkol-nyy
      - pressure/kostya-davayte-golosovat-kto-za
      effect: Миша взял паузу и договорился о встрече. Его просьба оставить запись в группе всё ещё в силе.
  alternative:
    mode: yellow
    messages:
    - remarka-ty-ubiraesh-telefon-cherez
    - vera-reminds-kostya
    - kostya-withdraws-poll
    - sistema-kostya-zakryl-opros
    - vera-mish-ya-u-kabineta
    question: Что тебе сейчас подходит?
    choices:
      follow-up: Спрошу Веру, появилось ли что-нибудь в школьном чате.
      pause: Отложу телефон. К разговору с Верой можно вернуться позже.
    review:
      signals:
      - start/misha-kost-etot-v-shkol-nyy
      - pressure/kostya-davayte-golosovat-kto-za
      effect: Пока ты играл, Вера напомнила Косте о твоём отказе и он снял опрос. Ты прочитал их разговор после репетиции.
      miss: false
  follow-up:
    mode: orange
    messages:
    - misha-asks-about-school-chat
    - vera-checks-school-chat
    outcome:
    - positive
    - Вера проверила школьный чат
    note: Вера посмотрела школьный чат и сказала тебе, что новых сообщений там пока нет.
    review:
      signals:
      - alternative/sistema-kostya-zakryl-opros
      effect: Вера посмотрела школьный чат и сказала тебе, что новых сообщений там пока нет.
  pause:
    mode: yellow
    messages:
    - remarka-na-etom-dubl-zakanchivaetsya
    outcome:
    - open
    - Опрос закрыт. Вера на связи
    note: Можно отложить телефон. Ты увидел, что Костя закрыл опрос. Решать, хочешь ли ты обсудить это с Верой, можно позже.
    review:
      signals:
      - alternative/sistema-kostya-zakryl-opros
      effect: Можно взять паузу. Решать, возвращаться ли к этому разговору, по-прежнему тебе.
  calm:
    mode: yellow
    messages:
    - kostya-ok-togda-posledniy-progon
    - misha-da-vot-ego-mozhno
    continuation: true
    question: Как продолжишь?
    choices:
      calm-end: Послушаю, как звучит наша группа на записи.
      ask: Самому указать нужный файл
      calm-watch: Открою школьный чат и проверю, выложил ли Костя последний прогон.
  calm-end:
    mode: yellow
    messages:
    - kostya-posledniy-progon-shkol-naya
    outcome:
    - positive
    - В общешкольный чат отправили согласованный дубль
    note: Миша согласился на последний прогон. Именно этот файл появился в общешкольном чате.
  ask:
    mode: orange
    messages:
    - ty-posledniy-gde-my
    - kostya-aga-ego-i-vzyal
    outcome:
    - positive
    - Костя подтвердил выбор записи
    note: Костя уточнил файл до публикации. Первый дубль остался в группе.
  observe:
    mode: yellow
    messages:
    - vera-reminds-kostya
    - kostya-withdraws-poll
    - sistema-kostya-zakryl-opros
    question: Костя закрыл опрос. Что теперь?
    choices:
      observe-ease: Отвечу в группе, можно ли выкладывать последний прогон.
      observe-watch: Уточню, какой дубль разрешаю выложить, и открою школьный чат.
    review:
      signals:
      - start/misha-kost-etot-v-shkol-nyy
      - pressure/kostya-davayte-golosovat-kto-za
      effect: Ты увидел ответ сразу, в перерыве. Вера напомнила про твой отказ, и Костя снял опрос.
  observe-ease:
    mode: yellow
    messages:
    - kostya-vot-posledniy-progon
    - self-allows-last-take
    outcome:
    - positive
    - Миша согласился на последний прогон
    note: Костя предложил последний прогон. Ты подтвердил, что его можно показать в школьном чате.
    review:
      signals:
      - observe/sistema-kostya-zakryl-opros
      effect: Костя предложил последний прогон. Ты подтвердил, что его можно показать в школьном чате.
  observe-watch:
    mode: orange
    messages:
    - misha-allows-last-take
    - kostya-posledniy-progon-shkol-naya
    outcome:
    - positive
    - В школьный чат ушёл выбранный Мишей дубль
    note: Ты назвал конкретную запись. Костя отправил её, и ты видишь видео в школьном чате.
    review:
      signals:
      - observe/sistema-kostya-zakryl-opros
      effect: Ты назвал конкретную запись. Костя отправил её, и ты видишь видео в школьном чате.
  focus:
    mode: orange
    messages:
    - misha-declines-first-take
    - kostya-stop-mish-uvidel-tvoyo
    - sistema-kostya-zakryl-opros
    question: Костя закрыл опрос. Что теперь?
    choices:
      focus-ease: Отвечу в группе, можно ли выкладывать последний прогон.
      focus-watch: Уточню, какой дубль разрешаю выложить, и открою школьный чат.
    review:
      signals:
      - start/misha-kost-etot-v-shkol-nyy
      - pressure/kostya-davayte-golosovat-kto-za
      effect: Ты повторил просьбу под опросом. Костя снял голосование и предложил последний прогон.
  focus-ease:
    mode: yellow
    messages:
    - kostya-vot-posledniy-progon
    - self-allows-last-take
    outcome:
    - positive
    - Миша согласился на последний прогон
    note: Костя предложил последний прогон. Ты подтвердил, что его можно показать в школьном чате.
    review:
      signals:
      - focus/sistema-kostya-zakryl-opros
      effect: Костя предложил последний прогон. Ты подтвердил, что его можно показать в школьном чате.
  focus-watch:
    mode: orange
    messages:
    - misha-allows-last-take
    - kostya-posledniy-progon-shkol-naya
    outcome:
    - positive
    - В школьный чат ушёл выбранный Мишей дубль
    note: Ты назвал конкретную запись. Костя отправил её, и ты видишь видео в школьном чате.
    review:
      signals:
      - focus/sistema-kostya-zakryl-opros
      effect: Ты назвал конкретную запись. Костя отправил её, и ты видишь видео в школьном чате.
  calm-watch:
    mode: orange
    messages:
    - kostya-posledniy-progon-shkol-naya
    outcome:
    - positive
    - В школьном чате появился последний прогон
    note: Ты открыл общешкольный чат. Под видео стоит подпись «Последний прогон», как вы с Костей и договорились.
cues:
  start/misha-kost-etot-v-shkol-nyy: Миша разрешил показать запись только внутри группы.
  pressure/kostya-davayte-golosovat-kto-za: Костя предложил решать за Мишу уже после его ответа.
  alternative/sistema-kostya-zakryl-opros: Ты прочитал в чате, что Костя закрыл голосование. Отправлял ли кто-нибудь запись в школьный чат, здесь не видно.
  observe/sistema-kostya-zakryl-opros: Сообщение системы появилось сразу после слов Кости о том, что он снимет опрос.
  focus/sistema-kostya-zakryl-opros: Сообщение системы появилось сразу после слов Кости о том, что он снимет опрос.
