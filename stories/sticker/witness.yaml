  pressure/lera-ya-emu-vchera-napisala: Лера уже просила об этом в личке. Сегодня тот же кот снова появился под голосовым.
  ignore/lera-ver-ty-kley-to-vzyala: Теперь к тебе обратились напрямую.
  observe/danya-u-menya-tyubik-seychas: Появился ответ на вопрос из голосового. Про вчерашнюю просьбу Даня пока ничего не сказал.
