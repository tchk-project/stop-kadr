scenes:
  start:
    mode: yellow
    messages:
    - misha-sobral-ler-otkroesh-na
    - anya-mish-na-pervoy-nas
    - misha-ya-teh-vpisal-kto
    - ty-a-grafiki-ya-vsyo
    choices:
      pressure: Читать дальше
      calm: Спокойный дубль
  pressure:
    mode: yellow
    messages:
    - misha-ler-otkryvay-chto-skinul
    - anya-my-seychas-vyhodim-na
    continuation: true
    question: Защита вот-вот начнётся. Чего хочешь ты?
    choices:
      alternative: Может, файла для сдачи хватит. Сейчас соглашусь начать.
      pressure-act-0: Меня всё ещё нет на титульном. Попрошу Леру подождать.
      pressure-act-1: Мои подписи под графиками уже есть. Покажу учительнице.
      observe: Может, Миша успеет до показа. Посмотрю на экран.
      focus: Спрошу Аню, видно ли моё имя с её места.
  pressure-act-0:
    mode: orange
    messages:
    - ty-ler-pogodi-vyvodit-mish
    - lera-u-menya-poka-zastavka
    - misha-gotovo-tim-vot-teper
    - ty-teper-est-ler-mozhno
    outcome:
    - positive
    - Лера дождалась файла с твоим именем
    note: На экране класса пока заставка. В присланном файле ты увидел своё имя и сказал Лере, что его можно открывать.
    review:
      signals:
      - start/ty-a-grafiki-ya-vsyo
      - pressure/misha-ler-otkryvay-chto-skinul
      effect: На экране класса пока заставка. В присланном файле ты увидел своё имя и сказал Лере, что его можно открывать.
  pressure-act-1:
    mode: orange
    messages:
    - ty-marina-sergeevna-eto-moi
    - marina-sergeevna-konechno-ty-hochesh
    - ty-v-nachale-pozhaluysta-grafiki
    outcome:
    - positive
    - Учительница спросила, как представить твой вклад
    note: Подписи под графиками увидела учительница. Ты попросил её назвать тебя в начале, а выступление оставил Ане. Объявление класс ещё не слышал.
    review:
      signals:
      - start/ty-a-grafiki-ya-vsyo
      - pressure/misha-ler-otkryvay-chto-skinul
      effect: Подписи под графиками увидела учительница. Ты попросил её назвать тебя в начале, а выступление оставил Ане. Объявление класс ещё не слышал.
  alternative:
    mode: yellow
    messages:
    - ty-ladno-pokazyvayte-mish-posle
    - misha-da-ler-zapuskay
    - marina-sergeevna-proekt-mishi-i
    - remarka-posle-zaschity-misha-vpisal
    question: Что тебе сейчас подходит?
    choices:
      follow-up: Попросить отдельно отметить работу с графиками
      pause: Послушаю следующую группу. Пока оставлю файл как есть.
    review:
      signals:
      - start/ty-a-grafiki-ya-vsyo
      - pressure/misha-ler-otkryvay-chto-skinul
      effect: Тимур согласился подождать. Миша исправил файл, но объявление уже прозвучало. За первый титульный отвечал Миша. Если Тимуру важно, чтобы класс тоже узнал, он может попросить учительницу об этом отдельно.
      miss: false
  follow-up:
    mode: orange
    messages:
    - ty-marina-sergeevna-grafiki-ya
    - marina-sergeevna-da-pokazhesh-kakie
    outcome:
    - positive
    - Учительница спросила о работе Тимура
    note: С классом защита уже закончилась. Теперь о твоём вкладе знает учительница. Она попросила показать ей графики для отзыва.
    review:
      signals:
      - alternative/remarka-posle-zaschity-misha-vpisal
      effect: С классом защита уже закончилась. Теперь о твоём вкладе знает учительница. Она попросила показать ей графики для отзыва.
  pause:
    mode: yellow
    messages:
    - remarka-na-etom-dubl-zakanchivaetsya
    outcome:
    - open
    - Класс увидел презентацию без твоего имени
    note: Можно пока оставить всё как есть. Миша вписал твоё имя в файл для сдачи. Классу успели представить только Мишу и Аню. Захочешь ли отдельно поговорить с учительницей, решаешь ты.
    review:
      signals:
      - alternative/remarka-posle-zaschity-misha-vpisal
      effect: Можно взять паузу. Решать, возвращаться ли к этому разговору, по-прежнему тебе.
  calm:
    mode: yellow
    messages:
    - misha-dobavil-tim-glyan-pervuyu
    - anya-tim-ty-sam-pro
    continuation: true
    question: Твоё имя вернули. Что скажешь Ане?
    choices:
      calm-act-0: Рассказать про один график самому
      calm-act-1: Попросить Аню показать оба графика
      calm-watch: Со своего места не разберу. Спрошу Аню, видно ли моё имя на экране.
  calm-act-0:
    mode: yellow
    messages:
    - ty-teper-vizhu-svoyo-imya
    - anya-aga-posle-pervoy-kartinki
    outcome:
    - positive
    - Аня и Тимур разделили выступление
    note: Тимур выбрал тот график, про который хочет рассказать. Аня знает, когда передать ему слово.
  calm-act-1:
    mode: orange
    messages:
    - ty-teper-vsyo-na-meste
    - anya-davay-ya-esli-zabudu
    outcome:
    - positive
    - Имя на слайде есть. Выступить согласилась Аня
    note: Тимур остался автором и смог выбрать, хочет ли выходить к доске.
  observe:
    mode: yellow
    messages:
    - misha-tim-stoy-uspel-ler
    - anya-teper-troe-timur-tozhe
    question: Твоё имя видно классу. Что дальше?
    choices:
      observe-ease: Все три имени на месте. Послушаю выступление.
      observe-watch: После защиты попрошу прислать сданную версию и открою её.
    review:
      signals:
      - start/ty-a-grafiki-ya-vsyo
      - pressure/misha-ler-otkryvay-chto-skinul
      effect: Есть новый файл. Аня проверила, какие имена видны на экране.
  observe-ease:
    mode: yellow
    messages:
    - marina-sergeevna-vizhu-tryoh-avtorov
    outcome:
    - positive
    - Учительница увидела на экране трёх авторов
    note: Марина Сергеевна сказала, что видит трёх авторов, и спросила, кто начнёт.
    review:
      signals:
      - observe/anya-teper-troe-timur-tozhe
      effect: Марина Сергеевна сказала, что видит трёх авторов, и спросила, кто начнёт.
  observe-watch:
    mode: orange
    messages:
    - timur-asks-for-submission
    - misha-sends-submission
    - timur-checks-title
    outcome:
    - positive
    - Тимур проверил своё имя в сданной работе
    note: Ты открыл сданную презентацию и увидел своё имя на титульном.
    review:
      signals:
      - observe/anya-teper-troe-timur-tozhe
      effect: Ты открыл сданную презентацию и увидел своё имя на титульном.
  focus:
    mode: orange
    messages:
    - timur-asks-anya-to-check
    - misha-tim-stoy-uspel-ler
    - anya-teper-troe-timur-tozhe
    question: Твоё имя видно классу. Что дальше?
    choices:
      focus-ease: Все три имени на месте. Послушаю выступление.
      focus-watch: После защиты попрошу прислать сданную версию и открою её.
    review:
      signals:
      - start/ty-a-grafiki-ya-vsyo
      - pressure/misha-ler-otkryvay-chto-skinul
      effect: Ты попросил Аню посмотреть на экран. После замены файла она назвала твоё имя.
  focus-ease:
    mode: yellow
    messages:
    - marina-sergeevna-vizhu-tryoh-avtorov
    outcome:
    - positive
    - Учительница увидела на экране трёх авторов
    note: Марина Сергеевна сказала, что видит трёх авторов, и спросила, кто начнёт.
    review:
      signals:
      - focus/anya-teper-troe-timur-tozhe
      effect: Марина Сергеевна сказала, что видит трёх авторов, и спросила, кто начнёт.
  focus-watch:
    mode: orange
    messages:
    - timur-asks-for-submission
    - misha-sends-submission
    - timur-checks-title
    outcome:
    - positive
    - Тимур проверил своё имя в сданной работе
    note: Ты открыл сданную презентацию и увидел своё имя на титульном.
    review:
      signals:
      - focus/anya-teper-troe-timur-tozhe
      effect: Ты открыл сданную презентацию и увидел своё имя на титульном.
  calm-watch:
    mode: orange
    messages:
    - timur-checks-credit
    - anya-reads-credit
    outcome:
    - positive
    - Аня прочитала Тимуру три имени с экрана
    note: Аня прочитала вслух титульный слайд. Тимур смог проверить, какую версию видят в классе, и пока не выбирал, хочет ли выступать.
cues:
  start/ty-a-grafiki-ya-vsyo: Тимур попросил указать его работу. На выступление он ещё не соглашался.
  pressure/misha-ler-otkryvay-chto-skinul: Класс увидит титульный раньше, чем в нём появится имя.
  alternative/remarka-posle-zaschity-misha-vpisal: Миша исправил файл для сдачи уже после выступления. Класс видел другую версию.
  observe/anya-teper-troe-timur-tozhe: Аня у экрана прочитала имя Тимура на титульном слайде новой версии.
  focus/anya-teper-troe-timur-tozhe: Аня у экрана прочитала имя Тимура на титульном слайде новой версии.
