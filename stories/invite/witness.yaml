scenes:
  start:
    mode: yellow
    messages:
    - misha-kto-zavtra-v-nochnoy
    - sistema-anya-vyshla-iz-besedy
    - sistema-kostya-dobavil-anyu-v
    - kostya-ty-pohozhe-sluchayno-vyshla
    choices:
      pressure: Читать дальше
      calm: Спокойный дубль
  pressure:
    mode: yellow
    messages:
    - anya-ya-sama-vyshla-ot
    - sistema-anya-vyshla-iz-besedy
    - sistema-kostya-dobavil-anyu-v-2
    - kostya-an-nas-pyatero-na
    continuation: true
    question: Ты помнишь вчерашний разговор. Что ответишь?
    choices:
      pressure-act-0: Аня вчера объяснила, зачем вышла. Напомню про это Косте.
      pressure-act-1: Не знаю, хочет ли она помощи в общем чате. Спрошу лично.
      alternative: Нам правда не хватает шестого. Попрошу Аню остаться на турнир.
      ignore: Заняться турнирной сеткой. С добавлением сами разберутся.
      observe: Может, Костя сам заглянет во вчерашний чат. Пока дочитаю.
      focus: После просьбы Аню опять добавили. Посмотрю, учтёт ли Костя её ответ.
  pressure-act-0:
    mode: orange
    messages:
    - ty-kost-anya-vchera-sama
    - kostya-a-tochno-an-ponyal
    - sistema-anya-vyshla-iz-besedy
    outcome:
    - positive
    - Костя ищет шестого. Аня вышла из чата
    note: Лера напомнила о просьбе, которую все видели. Костя продолжает собирать команду и ищет другого игрока.
    review:
      signals:
      - pressure/anya-ya-sama-vyshla-ot
      - pressure/kostya-an-nas-pyatero-na
      effect: Лера напомнила о просьбе, которую все видели. Костя продолжает собирать команду и ищет другого игрока.
  pressure-act-1:
    mode: orange
    messages:
    - ty-an-videla-tebya-opyat
    - anya-ne-nado-poka-ya
    - ty-ladno-do-zavtra
    outcome:
    - positive
    - Аня сама решила, нужна ли помощь Леры
    note: Аня сама сказала, нужна ли помощь в общем чате. Лера услышала её ответ.
    review:
      signals:
      - pressure/anya-ya-sama-vyshla-ot
      - pressure/kostya-an-nas-pyatero-na
      effect: Аня сама сказала, нужна ли помощь в общем чате. Лера услышала её ответ.
  alternative:
    mode: orange
    messages:
    - ty-an-tol-ko-na-etot
    - anya-ya-vchera-uzhe-prosila
    - sistema-anya-vyshla-iz-besedy
    - anya-ler-ty-zhe-videla
    outcome:
    - negative
    - Ане снова пришлось объяснять, почему она вышла
    note: Лера хотела собрать команду на вечер. После её просьбы Ане снова пришлось объясняться. Можно написать ей в личку, что зря стала уговаривать, а шестого поискать среди желающих.
    review:
      signals:
      - pressure/anya-ya-sama-vyshla-ot
      - pressure/kostya-an-nas-pyatero-na
      effect: Лера хотела собрать команду на вечер. После её просьбы Ане снова пришлось объясняться. Можно написать ей в личку, что зря стала уговаривать, а шестого поискать среди желающих.
      miss: true
  ignore:
    mode: white
    messages:
    - anya-ler-menya-uzhe-vtoroy
    question: Теперь ты знаешь ещё кое-что. Что сделаешь?
    choices:
      stay: Отложить ответ до конца матча.
      rejoin: Ответить в турнирном чате по просьбе Ани.
    review:
      miss: true
      signals:
      - pressure/anya-ya-sama-vyshla-ot
      - pressure/kostya-an-nas-pyatero-na
      effect: 'После твоего решения разговор продолжился: «Лер, меня уже второй раз вернули. Ты можешь им сказать, что я точно не играю?»'
      repair: rejoin
      recovery: Костя ищет другого игрока.
  stay:
    mode: white
    messages:
    - anya-ya-vere-napisala-ona
    outcome:
    - mixed
    - Ане пришлось обратиться к Вере
    note: Пока Лера играла, Аня попросила Веру передать её ответ команде.
    review:
      miss: true
      signals:
      - ignore/anya-ler-menya-uzhe-vtoroy
      effect: Пока Лера играла, Аня попросила Веру передать её ответ команде.
  rejoin:
    mode: orange
    messages:
    - ty-kost-anya-tochno-ne
    - kostya-ladno-dan-u-tebya
    outcome:
    - positive
    - Костя ищет другого игрока
    note: Лера передала именно то, о чём попросила Аня. Костя стал искать другого игрока.
  calm:
    mode: yellow
    messages:
    - anya-ya-sama-vyshla-ot-2
    - kostya-ponyal-an-na-turnir
    continuation: true
    question: Как продолжишь?
    choices:
      calm-end: Посмотреть, что будет дальше
      ask: Предложить себя на турнир
      calm-watch: Костя согласился. Посмотрю, вспомнит ли он про это перед игрой.
  calm-end:
    mode: yellow
    messages:
    - sistema-anya-vyshla-iz-besedy
    - danya-ya-s-vami-kuda
    outcome:
    - positive
    - Аня вышла из беседы
    note: Костя принял объяснение. На турнир можно позвать тех, кто сам хочет сыграть.
  ask:
    mode: yellow
    messages:
    - ty-kost-ya-mogu-na
    - kostya-zapisal-ler
    outcome:
    - positive
    - Лера записалась на первую игру
    note: Ребята договорились о турнире отдельно. Ане не пришлось оставаться в ночном чате.
  observe:
    mode: yellow
    messages:
    - kostya-an-vizhu-vcherashnee-bol-she
    question: Что изменилось для тебя сейчас?
    choices:
      observe-ease: Костя понял. На сегодня вопрос закрыт.
      observe-watch: Он обещал больше не добавлять. Посмотрю, сдержит ли слово.
    review:
      signals:
      - pressure/anya-ya-sama-vyshla-ot
      - pressure/kostya-an-nas-pyatero-na
      effect: Костя увидел прошлую просьбу. Место в составе он предложил другому игроку.
  observe-ease:
    mode: yellow
    messages:
    - sistema-anya-vyshla-iz-besedy
    outcome:
    - positive
    - Аня закончила разговор о турнире
    note: Костя увидел прошлую просьбу. Место в составе он предложил другому игроку.
    review:
      signals:
      - observe/kostya-an-vizhu-vcherashnee-bol-she
      effect: Костя увидел прошлую просьбу. Место в составе он предложил другому игроку.
  observe-watch:
    mode: orange
    messages:
    - sistema-anya-vyshla-iz-besedy
    outcome:
    - positive
    - Аня закончила разговор о турнире
    note: Костя увидел прошлую просьбу. Место в составе он предложил другому игроку.
    review:
      signals:
      - observe/kostya-an-vizhu-vcherashnee-bol-she
      effect: Он обещал больше не добавлять. Посмотрю, сдержит ли слово.
  focus:
    mode: orange
    messages:
    - kostya-an-vizhu-vcherashnee-bol-she
    question: Что изменилось для тебя сейчас?
    choices:
      focus-ease: Костя понял. На сегодня вопрос закрыт.
      focus-watch: Он обещал больше не добавлять. Посмотрю, сдержит ли слово.
    review:
      signals:
      - pressure/anya-ya-sama-vyshla-ot
      - pressure/kostya-an-nas-pyatero-na
      effect: Костя увидел прошлую просьбу. Место в составе он предложил другому игроку.
  focus-ease:
    mode: yellow
    messages:
    - sistema-anya-vyshla-iz-besedy
    outcome:
    - positive
    - Аня закончила разговор о турнире
    note: Костя увидел прошлую просьбу. Место в составе он предложил другому игроку.
    review:
      signals:
      - focus/kostya-an-vizhu-vcherashnee-bol-she
      effect: Костя увидел прошлую просьбу. Место в составе он предложил другому игроку.
  focus-watch:
    mode: orange
    messages:
    - sistema-anya-vyshla-iz-besedy
    outcome:
    - positive
    - Аня закончила разговор о турнире
    note: Костя увидел прошлую просьбу. Место в составе он предложил другому игроку.
    review:
      signals:
      - focus/kostya-an-vizhu-vcherashnee-bol-she
      effect: Он обещал больше не добавлять. Посмотрю, сдержит ли слово.
  calm-watch:
    mode: orange
    messages:
    - sistema-anya-vyshla-iz-besedy
    - danya-ya-s-vami-kuda
    outcome:
    - positive
    - Аня вышла из беседы
    note: Костя принял объяснение. На турнир можно позвать тех, кто сам хочет сыграть.
cues:
  pressure/anya-ya-sama-vyshla-ot: Аня объяснила, что вышла сама.
  pressure/kostya-an-nas-pyatero-na: После её просьбы Костя снова добавил Аню ради команды.
  ignore/anya-ler-menya-uzhe-vtoroy: Теперь к тебе обратились напрямую.
  observe/kostya-an-vizhu-vcherashnee-bol-she: Костя увидел прошлую просьбу. Место в составе он предложил другому игроку.
  focus/kostya-an-vizhu-vcherashnee-bol-she: Костя увидел прошлую просьбу. Место в составе он предложил другому игроку.
