scenes:
  start:
    mode: yellow
    messages:
    - lyosha-mish-kak-vchera-ty
    - misha-est-klyuchik-lyosh-ty
    - danya-mish-eschyo-raz-chto
    choices:
      pressure: Читать дальше
      calm: Спокойный дубль
  pressure:
    mode: yellow
    messages:
    - danya-est-klyuchik-narod-slyshali
    - misha-dan-hvatit-menya-peredraznivat
    continuation: true
    question: Миша хочет играть дальше. Что сделаешь?
    choices:
      pressure-act-0: Миша попросил перестать. Предложу играть через текст.
      alternative: Может, если пошутить про победу, всё уляжется. Подхвачу фразу.
      pressure-act-1: Даня передразнивает его при всех. Напишу модератору.
      ignore: Пока играть дальше. В голосе все так шутят.
      observe: Может, сейчас все вернутся к раунду. Пока послушаю.
      focus: Напишу в чат игры, что услышал Мишу про ключ.
  pressure-act-0:
    mode: orange
    messages:
    - ty-mish-ya-v-tekst
    - misha-poshli-ya-u-dveri
    - lyosha-vizhu-vas-otkryvay
    outcome:
    - positive
    - Миша продолжил раунд с вами в текстовом чате
    note: Ты предложил другой способ играть вместе. Миша согласился и снова смог договориться с Лёшей, куда идти.
    review:
      signals:
      - pressure/misha-dan-hvatit-menya-peredraznivat
      effect: Ты предложил другой способ играть вместе. Миша согласился и снова смог договориться с Лёшей, куда идти.
  pressure-act-1:
    mode: orange
    messages:
    - ty-v-tret-ey-komnate-danya
    - moderator-igry-seychas-zaydu-v
    - sistema-moderator-igry-voshyol-v
    - danya-mish-pri-modere-tozhe
    - remarka-u-imeni-mishi-zagorelsya
    - moderator-igry-ya-v-komnate
    question: Ты слышал тишину в канале. Что дальше?
    choices:
      pressure-act-1-next-0: 'Напишу Мише отдельно: «Если захочешь доиграть в тексте, я тут».'
      pressure-act-1-next-1: Модератор уже здесь. Дам Мише время и уберу свой микрофон.
    review:
      signals:
      - pressure/misha-dan-hvatit-menya-peredraznivat
      effect: По названию комнаты модератор нашёл разговор. Ты передал слова, которые сам слышал. Мише не пришлось ещё раз повторять их для записи.
  alternative:
    mode: yellow
    messages:
    - ty-u-nas-teper-klyuchik
    - danya-o-sasha-tozhe-zatsenil
    - sistema-misha-pokinul-golosovoy-kanal
    - misha-sash-hot-ty-to-zachem
    question: Миша написал тебе лично. Что ты сделаешь?
    choices:
      apologise: Отвечу Мише в личке, что зря подхватил шутку.
      leave-message: Сейчас вернусь к раунду и оставлю сообщение без ответа.
    review:
      signals:
      - pressure/misha-dan-hvatit-menya-peredraznivat
      effect: Ты повторил шутку в тексте после Мишиной просьбы остановиться. Миша вышел из голоса и спросил тебя об этом в личке.
      miss: true
      repair: apologise
      recovery: Ты ответил Мише лично и признал, что зря поддержал шутку. Миша сказал, что сейчас играть не хочет.
  apologise:
    mode: orange
    messages:
    - sasha-apologises-for-echo
    - misha-asks-for-time
    outcome:
    - open
    - Миша прочитал извинение и отложил игру
    note: Ты признал свою часть в шутке. Миша уже вышел из голоса. В личке он сам решил, когда готов снова играть.
    review:
      signals:
      - alternative/misha-sash-hot-ty-to-zachem
      effect: Миша прочитал твоё извинение. На предложение доиграть он ответил, что сейчас не хочет.
  leave-message:
    mode: yellow
    messages:
    - sasha-leaves-message-unanswered
    outcome:
    - negative
    - Миша вышел из голоса. Его вопрос пока без ответа
    note: Даня подхватил твою шутку в тексте. Миша вышел из голосового канала и написал тебе лично. В этом раунде ответа от тебя он не получил.
    review:
      signals:
      - alternative/misha-sash-hot-ty-to-zachem
      effect: Ты вернулся к раунду без Миши. Его личное сообщение осталось без ответа.
  ignore:
    mode: white
    messages:
    - misha-sash-ty-v-tekste
    question: Миша спрашивает, будешь ли ты в тексте. Что ответишь?
    choices:
      stay: Переключиться на раунд и не отвечать.
      rejoin: Договориться о команде через текст.
    review:
      miss: true
      signals:
      - pressure/misha-dan-hvatit-menya-peredraznivat
      effect: Миша сам сообщил, что в голосовой канал не вернётся. В тексте он всё ещё может с тобой договориться.
      repair: rejoin
      recovery: Миша выбрал текстовый чат.
  stay:
    mode: white
    messages:
    - remarka-misha-vyhodit-iz-gruppy
    outcome:
    - mixed
    - Команда начала следующий раунд без Миши
    note: Саша не ответил в личке. Миша вышел из группы, и команда продолжила игру без него.
    review:
      miss: true
      signals:
      - ignore/misha-sash-ty-v-tekste
      effect: Саша не ответил в личке. Миша вышел из группы, и команда продолжила игру без него.
  rejoin:
    mode: orange
    messages:
    - ty-ya-tut-mozhem-v
    - misha-davay-kinesh-kogda-nachinat
    outcome:
    - positive
    - Миша выбрал текстовый чат
    note: Саша ответил там, где Мише удобно говорить. Миша сам согласился продолжить игру в тексте.
  calm:
    mode: yellow
    messages:
    - danya-a-klyuch-ya-pravda
    - lyosha-my-u-dveri-mish
    continuation: true
    question: Как продолжишь?
    choices:
      calm-end: Пойду в следующую комнату с командой.
      ask: Уточнить свой ход
      calm-watch: Прислушаюсь, снова ли Даня попросит Мишу повторить это слово.
  calm-end:
    mode: yellow
    messages:
    - misha-otkryl-zahodim
    - sistema-komanda-pereshla-na-sleduyuschiy
    outcome:
    - positive
    - Команда вернулась к игре
    note: Даня уточнил слово один раз и вернулся к игре. Команда прошла через дверь.
  ask:
    mode: yellow
    messages:
    - ty-lyosh-ya-za-vami
    - lyosha-za-nami-misha-uzhe
    outcome:
    - positive
    - Команда нашла проход
    note: Следующая реплика про проход в игре. Уточнение Дани на этом закончилось.
  observe:
    mode: yellow
    messages:
    - danya-ladno-mish-uslyshal-vsyo
    - lyosha-dver-otkryta-zahodim
    question: Лёша зовёт в следующую комнату. Как продолжишь?
    choices:
      observe-ease: Даня услышал. Можно вернуться к раунду.
      observe-watch: Спрошу Мишу в личке, хочет ли он сыграть ещё один раунд со мной.
    review:
      signals:
      - pressure/misha-dan-hvatit-menya-peredraznivat
      effect: Даня прямо откликнулся на просьбу. Лёша вернулся к игре.
  observe-ease:
    mode: yellow
    messages:
    - sistema-komanda-prohodit-v-sleduyuschuyu
    outcome:
    - positive
    - Команда продолжила игру
    note: Команда прошла через дверь в следующую комнату. За этот ход Даня больше не повторял Мишино слово.
    review:
      signals:
      - observe/danya-ladno-mish-uslyshal-vsyo
      effect: Команда прошла через дверь в следующую комнату. За этот ход Даня больше не повторял Мишино слово.
  observe-watch:
    mode: orange
    messages:
    - sasha-invites-misha
    - misha-chooses-no-mic
    outcome:
    - positive
    - Миша согласился ещё на раунд без микрофона
    note: Вы договорились сыграть вдвоём. Миша сам выбрал, как ему общаться во время игры.
    review:
      signals:
      - observe/danya-ladno-mish-uslyshal-vsyo
      effect: Вы договорились сыграть вдвоём. Миша сам выбрал, как ему общаться во время игры.
  focus:
    mode: orange
    messages:
    - sasha-acknowledges-key
    - danya-ladno-mish-uslyshal-vsyo
    - lyosha-dver-otkryta-zahodim
    question: Лёша зовёт в следующую комнату. Как продолжишь?
    choices:
      focus-ease: Даня услышал. Можно вернуться к раунду.
      focus-watch: Спрошу Мишу в личке, хочет ли он сыграть ещё один раунд со мной.
    review:
      signals:
      - pressure/misha-dan-hvatit-menya-peredraznivat
      effect: Ты ответил по игре в текстовом чате. В голосовом канале Даня сам откликнулся на просьбу Миши.
  focus-ease:
    mode: yellow
    messages:
    - sistema-komanda-prohodit-v-sleduyuschuyu
    outcome:
    - positive
    - Команда продолжила игру
    note: Команда прошла через дверь в следующую комнату. За этот ход Даня больше не повторял Мишино слово.
    review:
      signals:
      - focus/danya-ladno-mish-uslyshal-vsyo
      effect: Команда прошла через дверь в следующую комнату. За этот ход Даня больше не повторял Мишино слово.
  focus-watch:
    mode: orange
    messages:
    - sasha-invites-misha
    - misha-chooses-no-mic
    outcome:
    - positive
    - Миша согласился ещё на раунд без микрофона
    note: Вы договорились сыграть вдвоём. Миша сам выбрал, как ему общаться во время игры.
    review:
      signals:
      - focus/danya-ladno-mish-uslyshal-vsyo
      effect: Вы договорились сыграть вдвоём. Миша сам выбрал, как ему общаться во время игры.
  calm-watch:
    mode: orange
    messages:
    - sasha-listens-at-door
    - sistema-komanda-pereshla-na-sleduyuschiy
    outcome:
    - positive
    - Даня заговорил про ход Миши в игре
    note: На этот раз Даня ответил на то, что сделал Миша в игре. Повторять слово никто не попросил.
  pressure-act-1-next-0:
    mode: orange
    messages:
    - remarka-v-lichke-prihodit-otvet
    outcome:
    - positive
    - Миша предложил вернуться к игре позже
    note: Ты позвал модератора в нужную комнату. По тишине в наушниках ты мог понять только то, что ответа пока нет.
    review:
      signals:
      - pressure-act-1/moderator-igry-ya-v-komnate
      effect: 'В личке приходит ответ от Миши: «Давай позже. Спасибо».'
  pressure-act-1-next-1:
    mode: yellow
    messages:
    - remarka-ty-vyklyuchaesh-mikrofon-chut
    outcome:
    - positive
    - Миша сам написал команде
    note: Ты позвал модератора в нужную комнату. По тишине в наушниках ты мог понять только то, что ответа пока нет.
    review:
      signals:
      - pressure-act-1/moderator-igry-ya-v-komnate
      effect: 'Ты выключаешь микрофон. Чуть позже Миша сам пишет в командный чат: «Я этот раунд пропущу».'
cues:
  alternative/misha-sash-hot-ty-to-zachem: Миша спрашивает тебя о твоей шутке. Он уже просил перестать.
  pressure/misha-dan-hvatit-menya-peredraznivat: В голосовом слышна просьба Миши. Ребятам уже известно, хочет ли он продолжать эту шутку.
  pressure-act-1/moderator-igry-ya-v-komnate: Ты позвал модератора в нужную комнату. По тишине в наушниках ты мог понять только то, что ответа пока нет.
  ignore/misha-sash-ty-v-tekste: Миша оставил открытым текстовый канал для игры вдвоём.
  observe/danya-ladno-mish-uslyshal-vsyo: Ты слышал, что Даня пообещал больше не повторять слово Миши, а Лёша заговорил о двери.
  focus/danya-ladno-mish-uslyshal-vsyo: Ты слышал, что Даня пообещал больше не повторять слово Миши, а Лёша заговорил о двери.
