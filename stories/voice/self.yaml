  alternative/lyosha-mish-my-zh-vchera: Лёша напомнил в личке, что вчера вы играли вдвоём. Общая команда раньше об оговорке не слышала.
  observe/danya-ladno-mish-uslyshal-vsyo: Даня прямо откликнулся на просьбу. Лёша вернулся к игре.
  focus/danya-ladno-mish-uslyshal-vsyo: Даня прямо откликнулся на просьбу. Лёша вернулся к игре.
