    mode: yellow
    messages:
    - danya-a-klyuch-ya-pravda
    - lyosha-my-u-dveri-mish
    continuation: true
    question: Как продолжишь?
    choices:
      calm-end: Посмотреть, что будет дальше
      ask: Подсказать команде, где проход
      calm-watch: Может, Даня и правда не расслышал. Послушаю следующую реплику.
