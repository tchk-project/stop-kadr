    - remarka-otpuskayu-knopku-v-lichke
    question: Как тебе удобнее продолжить?
    reaction:
      from: remarka-zhmu-knopku-mikrofona-znachok
      through: moderator-igry-ya-tut-mozhesh
      summary: Жму кнопку микрофона. Значок загорелся, все меня слышат, а я не могу выдавить ни слова.
    choices:
      pressure-act-1-next-0: Напишу модератору «я тут». Хочу остаться с ним в личке.
      pressure-act-1-next-1: Модератор уже в комнате. Возьму паузу и выйду из раунда.
    review:
      signals:
      - pressure/ty-dan-hvatit-menya-peredraznivat
      effect: Модератор отозвался. Ты можешь остаться в игре или взять паузу, пока он разбирается.
  alternative:
    mode: orange
    messages:
    - ty-da-ladno-vam-lyosh
    - danya-kirpich-ot-dveri
    - lyosha-mish-my-zh-vchera
    - remarka-ty-zovyosh-lyoshu-na
    question: Что тебе сейчас подходит?
    choices:
      follow-up: Написать Лёше отдельно
      pause: Закончить этот дубль здесь
    review:
      signals:
      - pressure/ty-dan-hvatit-menya-peredraznivat
      effect: 'Тебе хотелось, чтобы Даня переключился. За его насмешки отвечает он. Но Лёша теперь слышит в общем чате слова из вашей вчерашней игры. Можно написать ему отдельно: «Зря я про вчерашнее рассказал».'
      miss: false
