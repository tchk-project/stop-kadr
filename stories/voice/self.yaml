scenes:
  start:
    mode: yellow
    messages:
    - lyosha-mish-kak-vchera-ty
    - ty-est-klyuchik-lyosh-ty
    - danya-mish-eschyo-raz-chto
    choices:
      pressure: Читать дальше
      calm: Спокойный дубль
  pressure:
    mode: yellow
    messages:
    - danya-est-klyuchik-narod-slyshali
    - ty-dan-hvatit-menya-peredraznivat
    continuation: true
    question: Ты попросил Даню перестать. Как хочешь продолжить?
    choices:
      pressure-act-0: Мне сейчас удобнее играть без голоса. Перейду в текст.
      pressure-act-1: Меня всё ещё передразнивают. Попрошу модератора зайти.
      alternative: Хочу переключить шутки с себя. Напомню Лёшину оговорку.
      observe: Может, сейчас все вернутся к раунду. Пока послушаю.
      focus: Отвечу про ключ в игровом чате, микрофон пока оставлю включённым.
  pressure-act-0:
    mode: orange
    messages:
    - remarka-ty-vyklyuchaesh-zvuk-golosovogo
    - ty-lyosh-ya-v-tekst
    - lyosha-aga-stoyu-u-dveri
    outcome:
    - positive
    - Ты играешь с Лёшей через текст
    note: Ты убрал голосовой чат из наушников. Лёша ответил в тексте, и вы можете доиграть раунд вместе.
    review:
      signals:
      - pressure/ty-dan-hvatit-menya-peredraznivat
      effect: Ты убрал голосовой чат из наушников. Лёша ответил в тексте, и вы можете доиграть раунд вместе.
