scenes:
  start:
    mode: yellow
    messages:
    - marina-sergeevna-timur-poderzhi-afishu
    - timur-derzhu-zdes-svetlee-chem
    question: Что произойдёт дальше?
    choices:
      pressure: Продолжить
      calm: Спокойный дубль
  calm:
    mode: yellow
    messages:
    - timur-tak-tut-dva-lista
    - remarka-timur-vyravnivaet-listy-na
    continuation: true
    question: Что сейчас происходит?
    choices:
      calm-end: Буквы были на разных листах. Посмотрю на исправленную афишу.
  calm-end:
    mode: yellow
    messages:
    - remarka-staruyu-afishu-ubrali-marina
    outcome:
    - positive
    - Осталась одна афиша
    note: В этой версии истории никто не почувствовал внезапного изменения самочувствия.
  pressure:
    mode: yellow
    messages:
    - marina-sergeevna-stranno-vot-tol-ko
    - remarka-uchitel-nitsa-poshatnulas-i-vzyalas
    continuation: true
    question: Что в этой сцене требует твоего внимания?
    choices:
      call: У Марины Сергеевны вдруг двоится в глазах, она пошатнулась. Вызову скорую.
      delegate: Попрошу Веру прямо сейчас вызвать скорую. Останусь с учительницей у скамьи.
      wait: Может, это усталость. Посмотрю, пройдёт ли само.
  wait:
    mode: yellow
    messages:
    - remarka-marina-sergeevna-sidit-na
    - remarka-pri-takih-vnezapnyh-priznakah
    question: Что сделаешь теперь?
    choices:
      call-now: Позвоню 112 сейчас. Расскажу и о том, как всё началось, и о том, что изменилось.
    review:
      signals:
      - pressure/marina-sergeevna-stranno-vot-tol-ko
      miss: true
      effect: Марина Сергеевна сказала, что буквы больше не двоятся. Пока вы ждали, никто не позвонил в скорую.
      repair: call-now
      recovery: Ты набрал 112 и передал слова Марины Сергеевны о том, что двоение уже прошло.
  call:
    mode: red
    messages:
    - remarka-vyzov-112-prinyat
    - ty-u-uchitel-nitsy-vnezapno-dvoitsya
    - remarka-dispetcheru-nazyvayut-gorod-ulitsu
    - dispetcher-zapisal-adres-shkoly-i
    question: Что передашь о времени?
    choices:
      call-time: Скажу, когда всё было как обычно и когда заметили перемену.
    review:
      signals:
      - pressure/marina-sergeevna-stranno-vot-tol-ko
      effect: Диспетчер записал адрес школы. Он услышал, что Марина Сергеевна сказала про двоение и как она у тебя на глазах пошатнулась.
  call-time:
    mode: red
    messages:
    - ty-v-12-25-my-veshali
    - dispetcher-brigada-napravlena-ostavaytes-na
    outcome:
    - positive
    - Скорую вызвали, время передали
    note: Внезапное двоение и потеря равновесия могут быть признаками инсульта даже при обычной речи. Каждый из этих признаков сам по себе требует срочной оценки. В России сразу звонят 103 или 112. Опиши диспетчеру внезапные изменения, назови адрес и время начала. Если точное время неизвестно, скажи, когда человек в последний раз был в обычном состоянии.
    review:
      signals:
      - call/dispetcher-zapisal-adres-shkoly-i
      effect: Диспетчер узнал, что в 12:25 вы ещё вешали афишу, а сразу после этого Марина Сергеевна пошатнулась.
  delegate:
    mode: red
    messages:
    - timur-asks-vera
    - vera-calls
    - vera-u-uchitel-nitsy-vnezapno-dvoitsya
    - remarka-dispetcheru-nazyvayut-gorod-ulitsu
    - dispetcher-zapisal-adres-shkoly-i
    question: Что подскажешь Вере?
    choices:
      delegate-time: Скажу ей, когда мы с Мариной Сергеевной вешали афишу.
    review:
      signals:
      - pressure/marina-sergeevna-stranno-vot-tol-ko
      effect: Вера дозвонилась до диспетчера и назвала адрес школы. Ты остался у скамьи с Мариной Сергеевной.
  delegate-time:
    mode: red
    messages:
    - timur-tells-vera-time
    - vera-v-12-25-my-veshali
    - dispetcher-brigada-napravlena-ostavaytes-na
    outcome:
    - positive
    - Скорую вызвали, время передали
    note: Внезапное двоение и потеря равновесия могут быть признаками инсульта даже при обычной речи. Каждый из этих признаков сам по себе требует срочной оценки. В России сразу звонят 103 или 112. Опиши диспетчеру внезапные изменения, назови адрес и время начала. Если точное время неизвестно, скажи, когда человек в последний раз был в обычном состоянии.
    review:
      signals:
      - delegate/dispetcher-zapisal-adres-shkoly-i
      effect: Вера передала диспетчеру время с твоих слов. Диспетчер подтвердил, что бригаду направили.
  call-now:
    mode: red
    messages:
    - remarka-vyzov-112-prinyat
    - ty-u-uchitel-nitsy-vnezapno-dvoitsya
    - witness-reports-vision-now
    - remarka-dispetcheru-nazyvayut-gorod-ulitsu
    - dispetcher-zapisal-adres-shkoly-i
    question: Что передашь о времени?
    choices:
      call-now-time: Скажу, когда всё было как обычно и когда заметили перемену.
    review:
      signals:
      - wait/remarka-marina-sergeevna-sidit-na
      effect: Диспетчер узнал от тебя и о внезапной потере равновесия, и о том, что, по словам Марины Сергеевны, двоение прошло.
  call-now-time:
    mode: red
    messages:
    - ty-v-12-25-my-veshali
    - dispetcher-brigada-napravlena-ostavaytes-na
    outcome:
    - positive
    - Скорую вызвали, время передали
    note: Внезапное двоение и потеря равновесия могут быть признаками инсульта даже при обычной речи. Каждый из этих признаков сам по себе требует срочной оценки. В России сразу звонят 103 или 112. Опиши диспетчеру внезапные изменения, назови адрес и время начала. Если точное время неизвестно, скажи, когда человек в последний раз был в обычном состоянии.
    review:
      signals:
      - call-now/dispetcher-zapisal-adres-shkoly-i
      effect: Диспетчер узнал, что в 12:25 вы ещё вешали афишу, а сразу после этого Марина Сергеевна пошатнулась.
cues:
  pressure/marina-sergeevna-stranno-vot-tol-ko: Внезапное двоение и потеря равновесия могут быть признаками инсульта даже при обычной речи. Каждый из этих признаков сам по себе требует срочной оценки.
  wait/remarka-marina-sergeevna-sidit-na: Даже если симптомы прошли или ослабли, вызов скорой по-прежнему нужен немедленно.
  call/dispetcher-zapisal-adres-shkoly-i: Диспетчеру важно знать время начала или когда человек в последний раз был в обычном состоянии.
  delegate/dispetcher-zapisal-adres-shkoly-i: Диспетчеру важно знать время начала или когда человек в последний раз был в обычном состоянии.
  call-now/dispetcher-zapisal-adres-shkoly-i: Диспетчеру важно знать время начала или когда человек в последний раз был в обычном состоянии.
