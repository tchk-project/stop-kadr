    note: Внезапное двоение и потеря равновесия могут быть признаками инсульта даже при обычной речи. Каждый из этих признаков сам по себе требует срочной оценки. В России сразу звонят 103 или 112. Опиши диспетчеру внезапные изменения, назови адрес и время начала. Если точное время неизвестно, скажи, когда человек в последний раз был в обычном состоянии.
    review:
      signals:
      - delegate/dispetcher-zapisal-adres-shkoly-i
      effect: Диспетчер получил время, которое участники действительно помнят.
  call-now:
    mode: red
    messages:
    - remarka-vyzov-112-prinyat
    - ty-u-menya-vnezapno-stalo
    - ty-seychas-stalo-luchshe-rasskazhu
    - remarka-dispetcheru-nazyvayut-gorod-ulitsu
    - dispetcher-zapisal-adres-shkoly-i
    question: Что передашь о времени?
    choices:
      call-now-time: Скажу, когда всё было как обычно и когда заметили перемену.
    review:
      signals:
      - wait/remarka-poka-ty-sidish-bukvy
      effect: Вызов 112 принят. Внезапное двоение и потеря равновесия могут быть признаками инсульта даже при обычной речи. Каждый из этих признаков сам по себе требует срочной оценки.
  call-now-time:
    mode: red
    messages:
    - ty-v-12-25-ya-eschyo
    - dispetcher-brigada-napravlena-ostavaytes-na
    outcome:
    - positive
    - Скорую вызвали, время передали
    note: Внезапное двоение и потеря равновесия могут быть признаками инсульта даже при обычной речи. Каждый из этих признаков сам по себе требует срочной оценки. В России сразу звонят 103 или 112. Опиши диспетчеру внезапные изменения, назови адрес и время начала. Если точное время неизвестно, скажи, когда человек в последний раз был в обычном состоянии.
    review:
      signals:
      - call-now/dispetcher-zapisal-adres-shkoly-i
      effect: Диспетчер получил время, которое участники действительно помнят.
cues:
  pressure/remarka-tol-ko-chto-ty-videla: Внезапное двоение и потеря равновесия могут быть признаками инсульта даже при обычной речи. Каждый из этих признаков сам по себе требует срочной оценки.
  wait/remarka-poka-ty-sidish-bukvy: Даже если симптомы прошли или ослабли, вызов скорой по-прежнему нужен немедленно.
  call/dispetcher-zapisal-adres-shkoly-i: Диспетчеру важно знать время начала или когда человек в последний раз был в обычном состоянии.
  delegate/dispetcher-zapisal-adres-shkoly-i: Диспетчеру важно знать время начала или когда человек в последний раз был в обычном состоянии.
  call-now/dispetcher-zapisal-adres-shkoly-i: Диспетчеру важно знать время начала или когда человек в последний раз был в обычном состоянии.
