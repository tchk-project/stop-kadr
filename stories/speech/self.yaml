scenes:
  start:
    mode: yellow
    messages:
    - trener-vera-peredvin-pozhaluysta-skameyku
    - vera-tak-togda-ya-stavlyu
    question: Что произойдёт дальше?
    choices:
      pressure: Продолжить
      calm: Спокойный дубль
  calm:
    mode: yellow
    messages:
    - remarka-telefon-schyolkaet-ran-she-chem
    - trener-vera-davay-eschyo-raz
    continuation: true
    question: Что сейчас происходит?
    choices:
      calm-end: В кадр попало пол-лица. Переснимем фото.
  calm-end:
    mode: yellow
    messages:
    - remarka-na-vtorom-snimke-vse
    outcome:
    - positive
    - Командное фото готово
    note: В этой версии истории никто не почувствовал внезапного изменения самочувствия.
  pressure:
    mode: yellow
    messages:
    - remarka-hochesh-poprosit-rebyat-podvinut-sya
    - vera-u-vas-ugol-rta
    continuation: true
    question: Ты замечаешь резкую перемену. Что сделаешь?
    choices:
      call: Слова плохо слушаются. Наберу 112 на своём телефоне и передам его Вере.
      delegate: Покажу Вере на её телефон и поднесу руку к уху.
      wait: Может, это усталость. Посмотрю, пройдёт ли само.
  wait:
    mode: yellow
    messages:
    - remarka-teper-poluchaetsya-otchyotlivo-skazat
    - remarka-pri-takih-vnezapnyh-priznakah
    question: Что сделаешь теперь?
    choices:
      call-now: Наберу 112 и передам телефон Вере. Она видела, как всё началось.
    review:
      signals:
      - pressure/remarka-hochesh-poprosit-rebyat-podvinut-sya
      miss: true
      effect: Когда тебе удалось чётко произнести «Вера», угол рта всё ещё был опущен. Скорую к этому моменту ещё не вызвали.
      repair: call-now
      recovery: Ты набрал 112 и передал телефон Вере. Она смогла рассказать и о первых признаках, и о том, что изменилось.
  call:
    mode: red
    messages:
    - remarka-trener-peredayot-telefon
    - vera-u-trenera-vdrug-izmenilas
    - remarka-dispetcheru-nazyvayut-gorod-ulitsu
    - dispetcher-zapisal-adres-shkoly-i
    question: Как подскажешь Вере, когда это началось?
    choices:
      call-time: Покажу Вере на часы в зале. Она слышала меня перед фото.
    review:
      signals:
      - pressure/remarka-hochesh-poprosit-rebyat-podvinut-sya
      effect: Вера взяла у тебя телефон и смогла сразу объяснить диспетчеру, что с тобой произошло.
  call-time:
    mode: red
    messages:
    - remarka-ty-pokazyvaesh-vere-na
    - vera-v-16-10-trener-poprosil
    - dispetcher-brigada-napravlena-ostavaytes-na
    outcome:
    - positive
    - Скорую вызвали, время передали
    note: Внезапное нарушение речи или асимметрия лица — уже повод заподозрить инсульт и сразу вызвать скорую. В России сразу звонят 103 или 112. Опиши диспетчеру внезапные изменения, назови адрес и время начала. Если точное время неизвестно, скажи, когда человек в последний раз был в обычном состоянии.
    review:
      signals:
      - call/dispetcher-zapisal-adres-shkoly-i
      effect: Вера вспомнила, что в 16:10 ты ещё говорил как обычно, и передала это диспетчеру. Он сказал, что бригаду направили.
  delegate:
    mode: red
    messages:
    - remarka-vera-nabiraet-112
    - vera-u-trenera-vdrug-izmenilas
    - remarka-dispetcheru-nazyvayut-gorod-ulitsu
    - dispetcher-zapisal-adres-shkoly-i
    question: Как подскажешь Вере, когда это началось?
    choices:
      delegate-time: Покажу Вере на часы в зале. Она слышала меня перед фото.
    review:
      signals:
      - pressure/remarka-hochesh-poprosit-rebyat-podvinut-sya
      effect: Вера поняла твой жест. После твоего кивка она набрала 112 и назвала адрес школы.
  delegate-time:
    mode: red
    messages:
    - remarka-ty-pokazyvaesh-vere-na
    - vera-v-16-10-trener-poprosil
    - dispetcher-brigada-napravlena-ostavaytes-na
    outcome:
    - positive
    - Скорую вызвали, время передали
    note: Внезапное нарушение речи или асимметрия лица — уже повод заподозрить инсульт и сразу вызвать скорую. В России сразу звонят 103 или 112. Опиши диспетчеру внезапные изменения, назови адрес и время начала. Если точное время неизвестно, скажи, когда человек в последний раз был в обычном состоянии.
    review:
      signals:
      - delegate/dispetcher-zapisal-adres-shkoly-i
      effect: Вера вспомнила, что в 16:10 ты ещё говорил как обычно, и передала это диспетчеру. Он сказал, что бригаду направили.
  call-now:
    mode: red
    messages:
    - remarka-trener-peredayot-telefon
    - vera-u-trenera-vdrug-izmenilas
    - vera-seychas-stalo-luchshe-rasskazhu
    - remarka-dispetcheru-nazyvayut-gorod-ulitsu
    - dispetcher-zapisal-adres-shkoly-i
    question: Как подскажешь Вере, когда это началось?
    choices:
      call-now-time: Покажу Вере на часы в зале. Она слышала меня перед фото.
    review:
      signals:
      - wait/remarka-teper-poluchaetsya-otchyotlivo-skazat
      effect: Вера взяла у тебя телефон и рассказала диспетчеру, что речь стала чётче, а улыбка осталась неровной.
  call-now-time:
    mode: red
    messages:
    - remarka-ty-pokazyvaesh-vere-na
    - vera-v-16-10-trener-poprosil
    - dispetcher-brigada-napravlena-ostavaytes-na
    outcome:
    - positive
    - Скорую вызвали, время передали
    note: Внезапное нарушение речи или асимметрия лица — уже повод заподозрить инсульт и сразу вызвать скорую. В России сразу звонят 103 или 112. Опиши диспетчеру внезапные изменения, назови адрес и время начала. Если точное время неизвестно, скажи, когда человек в последний раз был в обычном состоянии.
    review:
      signals:
      - call-now/dispetcher-zapisal-adres-shkoly-i
      effect: Вера вспомнила, что в 16:10 ты ещё говорил как обычно, и передала это диспетчеру. Он сказал, что бригаду направили.
cues:
  pressure/remarka-hochesh-poprosit-rebyat-podvinut-sya: Внезапное нарушение речи или асимметрия лица — уже повод заподозрить инсульт и сразу вызвать скорую.
  wait/remarka-teper-poluchaetsya-otchyotlivo-skazat: Даже если симптомы прошли или ослабли, вызов скорой по-прежнему нужен немедленно.
  call/dispetcher-zapisal-adres-shkoly-i: Диспетчеру важно знать время начала или когда человек в последний раз был в обычном состоянии.
  delegate/dispetcher-zapisal-adres-shkoly-i: Диспетчеру важно знать время начала или когда человек в последний раз был в обычном состоянии.
  call-now/dispetcher-zapisal-adres-shkoly-i: Диспетчеру важно знать время начала или когда человек в последний раз был в обычном состоянии.
