scenes:
  start:
    mode: yellow
    messages:
    - trener-vera-peredvin-pozhaluysta-skameyku
    - vera-tak-togda-ya-stavlyu
    question: Что произойдёт дальше?
    choices:
      pressure: Продолжить
      calm: Спокойный дубль
  calm:
    mode: yellow
    messages:
    - remarka-telefon-schyolkaet-ran-she-chem
    - trener-vera-davay-eschyo-raz
    continuation: true
    question: Что сейчас происходит?
    choices:
      calm-end: В кадр попало пол-лица. Переснимем фото.
  calm-end:
    mode: yellow
    messages:
    - remarka-na-vtorom-snimke-vse
    outcome:
    - positive
    - Командное фото готово
    note: В этой версии истории никто не почувствовал внезапного изменения самочувствия.
  pressure:
    mode: yellow
    messages:
    - remarka-trener-tol-ko-chto-govoril
    - sasha-ya-tut-u-menya
    continuation: true
    question: Что в этой сцене требует твоего внимания?
    choices:
      call: Речь и лицо вдруг изменились. Вызову скорую прямо из зала.
      delegate: Саша с телефоном рядом. Попрошу его сейчас же вызвать скорую и останусь с тренером.
      wait: Может, это усталость. Посмотрю, пройдёт ли само.
  wait:
    mode: yellow
    messages:
    - remarka-trener-snova-mozhet-otchyotlivo
    - remarka-pri-takih-vnezapnyh-priznakah
    question: Что сделаешь теперь?
    choices:
      call-now: Позвоню 112 сейчас. Расскажу и о том, как всё началось, и о том, что изменилось.
    review:
      signals:
      - pressure/remarka-trener-tol-ko-chto-govoril
      miss: true
      effect: Тренер снова смог чётко произнести твоё имя. Улыбка осталась неровной, а вызова к этому моменту ещё не было.
      repair: call-now
      recovery: Ты всё-таки позвонила в 112 и рассказала, что тренер снова произнёс твоё имя, а улыбка осталась неровной.
  call:
    mode: red
    messages:
    - remarka-vyzov-112-prinyat
    - ty-u-trenera-vnezapno-izmenilas
    - remarka-dispetcheru-nazyvayut-gorod-ulitsu
    - dispetcher-zapisal-adres-shkoly-i
    question: Что передашь о времени?
    choices:
      call-time: Скажу, когда всё было как обычно и когда заметили перемену.
    review:
      signals:
      - pressure/remarka-trener-tol-ko-chto-govoril
      effect: Диспетчер услышал от тебя, как изменилась речь тренера, и записал, где вас найти.
  call-time:
    mode: red
    messages:
    - ty-v-16-10-trener-poprosil
    - dispetcher-brigada-napravlena-ostavaytes-na
    outcome:
    - positive
    - Скорую вызвали, время передали
    note: Внезапное нарушение речи или асимметрия лица — уже повод заподозрить инсульт и сразу вызвать скорую. В России сразу звонят 103 или 112. Опиши диспетчеру внезапные изменения, назови адрес и время начала. Если точное время неизвестно, скажи, когда человек в последний раз был в обычном состоянии.
    review:
      signals:
      - call/dispetcher-zapisal-adres-shkoly-i
      effect: Диспетчер узнал, что в 16:10 тренер ещё говорил как обычно. Он подтвердил, что бригаду направили.
  delegate:
    mode: red
    messages:
    - vera-asks-sasha-to-call
    - sasha-calls
    - sasha-u-trenera-vnezapno-izmenilas
    - remarka-dispetcheru-nazyvayut-gorod-ulitsu
    - dispetcher-zapisal-adres-shkoly-i
    question: Как поможешь передать время звонящему?
    choices:
      delegate-time: Напомню, когда всё было как обычно.
    review:
      signals:
      - pressure/remarka-trener-tol-ko-chto-govoril
      effect: Саша дозвонился и описал диспетчеру, что случилось. Ты осталась с тренером.
  delegate-time:
    mode: red
    messages:
    - ty-v-16-10-my-eschyo
    - sasha-v-16-10-trener-poprosil
    - dispetcher-brigada-napravlena-ostavaytes-na
    outcome:
    - positive
    - Скорую вызвали, время передали
    note: Внезапное нарушение речи или асимметрия лица — уже повод заподозрить инсульт и сразу вызвать скорую. В России сразу звонят 103 или 112. Опиши диспетчеру внезапные изменения, назови адрес и время начала. Если точное время неизвестно, скажи, когда человек в последний раз был в обычном состоянии.
    review:
      signals:
      - delegate/dispetcher-zapisal-adres-shkoly-i
      effect: Ты напомнила Саше про скамейку. Он передал диспетчеру, что в 16:10 тренер ещё говорил как обычно.
  call-now:
    mode: red
    messages:
    - remarka-vyzov-112-prinyat
    - ty-u-trenera-vnezapno-izmenilas
    - ty-seychas-stalo-luchshe-rasskazhu
    - remarka-dispetcheru-nazyvayut-gorod-ulitsu
    - dispetcher-zapisal-adres-shkoly-i
    question: Что передашь о времени?
    choices:
      call-now-time: Скажу, когда всё было как обычно и когда заметили перемену.
    review:
      signals:
      - wait/remarka-trener-snova-mozhet-otchyotlivo
      effect: Ты рассказала диспетчеру, как тренер говорил сначала и что изменилось, пока вы ждали.
  call-now-time:
    mode: red
    messages:
    - ty-v-16-10-trener-poprosil
    - dispetcher-brigada-napravlena-ostavaytes-na
    outcome:
    - positive
    - Скорую вызвали, время передали
    note: Внезапное нарушение речи или асимметрия лица — уже повод заподозрить инсульт и сразу вызвать скорую. В России сразу звонят 103 или 112. Опиши диспетчеру внезапные изменения, назови адрес и время начала. Если точное время неизвестно, скажи, когда человек в последний раз был в обычном состоянии.
    review:
      signals:
      - call-now/dispetcher-zapisal-adres-shkoly-i
      effect: Диспетчер узнал, что в 16:10 тренер ещё говорил как обычно. Он подтвердил, что бригаду направили.
cues:
  pressure/remarka-trener-tol-ko-chto-govoril: Внезапное нарушение речи или асимметрия лица — уже повод заподозрить инсульт и сразу вызвать скорую.
  wait/remarka-trener-snova-mozhet-otchyotlivo: Даже если симптомы прошли или ослабли, вызов скорой по-прежнему нужен немедленно.
  call/dispetcher-zapisal-adres-shkoly-i: Диспетчеру важно знать время начала или когда человек в последний раз был в обычном состоянии.
  delegate/dispetcher-zapisal-adres-shkoly-i: Диспетчеру важно знать время начала или когда человек в последний раз был в обычном состоянии.
  call-now/dispetcher-zapisal-adres-shkoly-i: Диспетчеру важно знать время начала или когда человек в последний раз был в обычном состоянии.
