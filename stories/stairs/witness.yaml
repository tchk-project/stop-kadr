scenes:
  start:
    mode: yellow
    messages:
    - remarka-na-peremene-sasha-idyot
    - sasha-ya-ne-hochu-dal-she
    - timur-on-zhe-uzhe-ushyol
    choices:
      pressure: Читать дальше
      calm: Спокойный дубль
  pressure:
    mode: yellow
    messages:
    - remarka-lyosha-vstayot-poperyok-prohoda
    - sasha-propusti-ya-hochu-k
    - lyosha-eschyo-shag-udaryu
    continuation: true
    question: Лёша угрожает Саше. Что ты сделаешь?
    choices:
      pressure-act-0: Лёша угрожает ударить. Окликну дежурную у двери прямо сейчас.
      pressure-act-1: Саше преградили путь и угрожают. Отойду туда, где безопасно, и позвоню 112.
      alternative: К лестнице нужна помощь. Напишу в чат класса.
      ignore: Пойти к кабинету. Может, Лёша уже отойдёт.
      observe: В кабинет рядом можно пройти. Покажу Саше на открытую дверь.
      focus: Зайду в соседний класс и позову Сашу оттуда.
  pressure-act-0:
    mode: red
    messages:
    - ty-marina-sergeevna-k-lestnitse
    - marina-sergeevna-ya-slyshu-idu
    - remarka-dezhurnaya-podhodit-lyosha-othodit
    - remarka-za-spinoy-u-sashi
    - remarka-sasha-vzdrognul-i-stoit
    - marina-sergeevna-sash-ya-pobudu
    question: Что ты можешь сделать со своего места?
    choices:
      pressure-act-0-next-0: 'Спрошу тихо: «Хочешь, мы с Тимуром тут посидим?»'
      pressure-act-0-next-1: Дежурная с Сашей. Отойду от двери, чтобы вокруг было меньше людей.
    review:
      signals:
      - pressure/remarka-lyosha-vstayot-poperyok-prohoda
      - pressure/lyosha-eschyo-shag-udaryu
      effect: Костя назвал место и передал угрозу, которую слышал сам. Дежурная подошла к ребятам.
  pressure-act-1:
    mode: red
    messages:
    - remarka-ty-othodish-k-dveri
    - remarka-operator-prinimaet-soobschenie-i
    outcome:
    - positive
    - Сообщение принято. К Саше подошла дежурная
    note: Ты сообщил об угрозе из безопасного места. Тимур смог позвать взрослого, который уже был рядом.
    review:
      signals:
      - pressure/remarka-lyosha-vstayot-poperyok-prohoda
      - pressure/lyosha-eschyo-shag-udaryu
      effect: Ты сообщил об угрозе из безопасного места. Тимур смог позвать взрослого, который уже был рядом.
  alternative:
    mode: orange
    messages:
    - ty-u-lestnitsy-sashu-ne
    - vera-a-uzhe-pozvali-ya
    - timur-ya-dumal-dezhurnaya-uzhe
    - remarka-u-lestnitsy-vsyo-eschyo
    outcome:
    - negative
    - У лестницы всё ещё нет взрослого
    note: В чате каждый мог решить, что взрослого уже позвал кто-то другой. До Саши помощь не дошла. С безопасного места можно окликнуть конкретного взрослого и назвать лестницу, у которой угрожают.
    review:
      signals:
      - pressure/remarka-lyosha-vstayot-poperyok-prohoda
      - pressure/lyosha-eschyo-shag-udaryu
      effect: В чате каждый мог решить, что взрослого уже позвал кто-то другой. До Саши помощь не дошла. С безопасного места можно окликнуть конкретного взрослого и назвать лестницу, у которой угрожают.
      miss: true
  ignore:
    mode: white
    messages:
    - timur-kost-dezhurnaya-tebya-vidit
    question: Теперь ты знаешь ещё кое-что. Что сделаешь?
    choices:
      stay: Пройти в класс. Кто ближе, тот позовёт.
      rejoin: Окликнуть дежурную от двери кабинета.
    review:
      miss: true
      signals:
      - pressure/remarka-lyosha-vstayot-poperyok-prohoda
      - pressure/lyosha-eschyo-shag-udaryu
      effect: 'После твоего решения разговор продолжился: «Кость, дежурная тебя видит! Позови её, он Сашу не пускает.»'
      repair: rejoin
      recovery: Дежурная услышала, куда идти.
  stay:
    mode: white
    messages:
    - timur-marina-sergeevna-k-lestnitse
    outcome:
    - mixed
    - Дежурную окликнул Тимур
    note: Костя прошёл дальше. Тимур сам позвал дежурную. Пока не видно, услышала ли она и что сделал Лёша.
    review:
      miss: true
      signals:
      - ignore/timur-kost-dezhurnaya-tebya-vidit
      effect: Костя прошёл дальше. Тимур сам позвал дежурную. Пока не видно, услышала ли она и что сделал Лёша.
  rejoin:
    mode: red
    messages:
    - ty-marina-sergeevna-sashe-u
    - marina-sergeevna-slyshu-idu
    outcome:
    - positive
    - Дежурная услышала, куда идти
    note: Костя назвал конкретное место. Дежурная ответила, что идёт к лестнице.
  calm:
    mode: yellow
    messages:
    - lyosha-ladno-na-urok-tak
    - remarka-lyosha-otoshyol-k-oknu
    continuation: true
    question: Как продолжишь?
    choices:
      calm-end: Посмотреть, что будет дальше
      ask: Спросить Сашу, пойдёт ли он с тобой
      calm-watch: Саша прошёл. Ещё немного присмотрюсь к тому, что происходит у лестницы.
  calm-end:
    mode: yellow
    messages:
    - timur-sash-u-nas-na
    - sasha-aga-geografiya
    outcome:
    - positive
    - Ребята разошлись перед уроком
    note: Когда Саша сказал, что идёт на урок, Лёша освободил проход.
  ask:
    mode: yellow
    messages:
    - ty-sash-ya-tozhe-na
    - sasha-davay-do-zvonka-minuta
    outcome:
    - positive
    - До кабинета ребята идут вместе
    note: Разойтись после спора удалось. Теперь можно вместе дойти до кабинета.
  observe:
    mode: orange
    messages:
    - ty-sash-syuda-mozhno-dver
    - remarka-sasha-othodit-ot-lestnitsy
    question: Саша уже в классе. Что ты сделаешь?
    choices:
      observe-ease: Мы в классе, здесь есть взрослый. Можно выдохнуть.
      observe-watch: Расскажу дежурной, какие слова я слышал.
    review:
      signals:
      - pressure/remarka-lyosha-vstayot-poperyok-prohoda
      - pressure/lyosha-eschyo-shag-udaryu
      effect: Саша уже в классе. Между ним и Лёшей у двери стоит дежурная.
  observe-ease:
    mode: yellow
    messages:
    - marina-sergeevna-ya-pobudu-zdes
    outcome:
    - positive
    - Саша в классе вместе с ребятами и дежурной
    note: Саша уже в классе. Между ним и Лёшей у двери стоит дежурная.
    review:
      signals:
      - observe/remarka-sasha-othodit-ot-lestnitsy
      effect: Саша уже в классе. Между ним и Лёшей у двери стоит дежурная.
  observe-watch:
    mode: orange
    messages:
    - kostya-describes-threat
    - teacher-promises-to-call
    outcome:
    - positive
    - Дежурная услышала рассказ Кости
    note: Ты рассказал, что сам слышал у лестницы. Дежурная взялась позвать классного руководителя.
    review:
      signals:
      - observe/remarka-sasha-othodit-ot-lestnitsy
      effect: Ты рассказал, что сам слышал у лестницы. Дежурная взялась позвать классного руководителя.
  focus:
    mode: red
    messages:
    - kostya-enters-class
    - kostya-calls-from-door
    - remarka-sasha-othodit-ot-lestnitsy
    question: Саша уже в классе. Что ты сделаешь?
    choices:
      focus-ease: Мы в классе, здесь есть взрослый. Можно выдохнуть.
      focus-watch: Расскажу дежурной, какие слова я слышал.
    review:
      signals:
      - pressure/remarka-lyosha-vstayot-poperyok-prohoda
      - pressure/lyosha-eschyo-shag-udaryu
      effect: Ты позвал Сашу из класса. Он зашёл к ребятам, а дежурная встала в дверях.
  focus-ease:
    mode: yellow
    messages:
    - marina-sergeevna-ya-pobudu-zdes
    outcome:
    - positive
    - Саша в классе вместе с ребятами и дежурной
    note: Саша уже в классе. Между ним и Лёшей у двери стоит дежурная.
    review:
      signals:
      - focus/remarka-sasha-othodit-ot-lestnitsy
      effect: Саша уже в классе. Между ним и Лёшей у двери стоит дежурная.
  focus-watch:
    mode: orange
    messages:
    - kostya-describes-threat
    - teacher-promises-to-call
    outcome:
    - positive
    - Дежурная услышала рассказ Кости
    note: Ты рассказал, что сам слышал у лестницы. Дежурная взялась позвать классного руководителя.
    review:
      signals:
      - focus/remarka-sasha-othodit-ot-lestnitsy
      effect: Ты рассказал, что сам слышал у лестницы. Дежурная взялась позвать классного руководителя.
  calm-watch:
    mode: orange
    messages:
    - timur-sash-u-nas-na
    - sasha-aga-geografiya
    outcome:
    - positive
    - Ребята разошлись перед уроком
    note: Когда Саша сказал, что идёт на урок, Лёша освободил проход.
  pressure-act-0-next-0:
    mode: orange
    messages:
    - remarka-sasha-kivaet-na-skameyku
    outcome:
    - positive
    - Саша показал, где хочет посидеть
    note: Дежурная пришла, когда ты её позвал. Ты мог видеть, что Саша остановился, и оставить ему время ответить.
    review:
      signals:
      - pressure-act-0/marina-sergeevna-sash-ya-pobudu
      effect: Саша кивает на скамейку. Вы остаётесь рядом с ним и дежурной.
  pressure-act-0-next-1:
    mode: yellow
    messages:
    - remarka-ty-prohodish-v-klass
    outcome:
    - positive
    - У лестницы стало свободнее
    note: Дежурная пришла, когда ты её позвал. Ты мог видеть, что Саша остановился, и оставить ему время ответить.
    review:
      signals:
      - pressure-act-0/marina-sergeevna-sash-ya-pobudu
      effect: Ты проходишь в класс. С порога видишь, как Саша и дежурная садятся на скамейку.
cues:
  pressure/remarka-lyosha-vstayot-poperyok-prohoda: Дежурная у соседней двери. Ей можно сказать, где нужна помощь.
  pressure/lyosha-eschyo-shag-udaryu: Лёша преградил проход и прямо пригрозил ударить.
  pressure-act-0/marina-sergeevna-sash-ya-pobudu: Дежурная пришла, когда ты её позвал. Ты мог видеть, что Саша остановился, и оставить ему время ответить.
  ignore/timur-kost-dezhurnaya-tebya-vidit: Теперь к тебе обратились напрямую.
  observe/remarka-sasha-othodit-ot-lestnitsy: Саша уже в классе. Между ним и Лёшей у двери стоит дежурная.
  focus/remarka-sasha-othodit-ot-lestnitsy: Саша уже в классе. Между ним и Лёшей у двери стоит дежурная.
