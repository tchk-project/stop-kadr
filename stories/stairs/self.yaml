      pressure-act-0: Мне угрожают и не дают пройти. Окликну дежурную сейчас.
      pressure-act-1: Тимур рядом и слышит угрозу. Попрошу его позвать дежурную.
      observe: В соседнем кабинете ребята. Отойду туда от лестницы.
      focus: Лёша угрожает ударить. Отойду в открытый кабинет, где есть люди.
