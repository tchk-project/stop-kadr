      summary: Я собирался сказать, что мы уходим. Даже знал, какими словами. А сейчас стою и не могу их выговорить.
    choices:
      meet-at-door-next-0: Кивну и выйду вместе с Мишей.
      meet-at-door-next-1: Покажу Мише на тренера. Хочу подождать рядом с ним.
