cues:
  pressure/danya-togda-s-tebya-dvesti: За отказ Даня повысил сумму и сказал, что будет ждать после уроков.
  pressure/sasha-mish-oni-vchera-tozhe-2: У раздевалки тебя ждали вчера. Сегодня ты можешь сам выбрать с Мишей место встречи.
  alternative/danya-sto-segodnya-pro-zavtra: Даже на предложение заплатить Даня ответил новой угрозой. Саша ещё может обратиться к взрослому до выхода из школы.
  observe/sasha-da-ya-s-vami: Ты видишь тренера у кабинета и уже сказал, что пойдёшь с ним.
  focus/sasha-da-ya-s-vami: Ты видишь тренера у кабинета и уже сказал, что пойдёшь с ним.
  meet-at-door/misha-ya-zdes-trener-tozhe: Ты заранее попросил Мишу встретить тебя. Он знал, где ждать, даже когда у двери ты не смог ответить.
