scenes:
  start:
    mode: yellow
    messages:
    - danya-rebyat-po-sotke-na
    - sasha-ya-v-etot-raz-2
    choices:
      pressure: Читать дальше
      calm: Спокойный дубль
  pressure:
    mode: yellow
    messages:
    - danya-togda-s-tebya-dvesti
    - sasha-mish-oni-vchera-tozhe-2
    continuation: true
    question: Последний урок ещё не кончился. Что тебе сейчас подойдёт?
    choices:
      pressure-act-0: После отказа мне угрожают встречей. Подойду к дежурной до звонка.
      alternative: Может, если договорюсь о сотне, меня не будут ждать. Попробую сторговаться.
      pressure-act-1: Попрошу маму меня встретить. До встречи побуду у дежурной.
      observe: Может, разговор вернётся к подарку. Пока почитаю чат секции.
      focus: Перечитаю, что именно Даня написал про деньги.
      meet-at-door: Вчера они ждали у раздевалки. Останусь в классе с учительницей и попрошу Мишу прийти с тренером.
  pressure-act-0:
    mode: red
    messages:
    - ty-marina-sergeevna-s-menya
    - marina-sergeevna-konechno-davay-zdes
    - ty-ya-sam-mame-napishu
    - marina-sergeevna-da-ya-zdes
    outcome:
    - positive
    - Марина Сергеевна остаётся с тобой
    note: Дежурная услышала, чего ты опасаешься, и осталась рядом. Можно вместе решить, с кем ты пойдёшь после уроков.
    review:
      signals:
      - pressure/danya-togda-s-tebya-dvesti
      effect: Дежурная услышала, чего ты опасаешься, и осталась рядом. Можно вместе решить, с кем ты пойдёшь после уроков.
  pressure-act-1:
    mode: red
    messages:
    - remarka-u-uchitel-skoy-ty-nahodish
    - ty-mam-smozhesh-menya-vstretit
    - mama-sashi-da-podozhdi-u
    outcome:
    - positive
    - Вы договорились, где встретитесь после уроков
    note: Дома знают и про угрозу, и где тебя найти. До встречи рядом есть взрослый, которому можно сказать, если станет страшно.
    review:
      signals:
      - pressure/danya-togda-s-tebya-dvesti
      effect: Дома знают и про угрозу, и где тебя найти. До встречи рядом есть взрослый, которому можно сказать, если станет страшно.
  alternative:
    mode: orange
    messages:
    - ty-davay-sto-kak-vnachale
    - danya-sto-segodnya-pro-zavtra
    - remarka-pered-poslednim-zvonkom-ty
    question: Что тебе сейчас подходит?
    choices:
      follow-up: Подойду к дежурной, пока не пошёл к выходу.
      pause: Останусь в классе с учительницей. Пока не хочу рассказывать.
    review:
      signals:
      - pressure/danya-togda-s-tebya-dvesti
      effect: Торг был попыткой выиграть время. Обещания оставить тебя в покое ты так и не получил. За угрозу отвечает Даня. Можно остаться возле дежурной, показать ей сообщение и попросить встретить тебя после уроков.
      miss: false
  follow-up:
    mode: red
    messages:
    - ty-marina-sergeevna-u-menya
    - marina-sergeevna-konechno-ostanus-s
    outcome:
    - positive
    - Рядом с Сашей осталась дежурная
    note: Ты рассказал про деньги и про то, что тебя обещали ждать после уроков. Дежурная согласилась побыть рядом и предложила вместе решить, кого позвать.
    review:
      signals:
      - alternative/danya-sto-segodnya-pro-zavtra
      effect: Ты рассказал про деньги и про то, что тебя обещали ждать после уроков. Дежурная согласилась побыть рядом и предложила вместе решить, кого позвать.
  pause:
    mode: orange
    messages:
    - remarka-na-etom-dubl-zakanchivaetsya
    outcome:
    - open
    - Даня продолжает требовать деньги
    note: Можно побыть рядом с учительницей и решить, когда говорить. Даня всё ещё требует деньги. За его угрозу отвечает он.
    review:
      signals:
      - alternative/danya-sto-segodnya-pro-zavtra
      effect: Можно взять паузу. Решать, возвращаться ли к этому разговору, по-прежнему тебе.
  calm:
    mode: yellow
    messages:
    - danya-ok-sash-vycherknul-ver-2
    - vera-sem-sot-na-otkrytku-hvatit
    continuation: true
    question: Как продолжишь?
    choices:
      calm-end: Дочитаю, кто принесёт открытку.
      ask: Предложить подписать открытку
      calm-watch: Отложу телефон. Надо собрать сумку на тренировку.
  calm-end:
    mode: yellow
    messages:
    - vera-kuplyu-otkrytku
    - danya-prinesu-ruchku
    outcome:
    - positive
    - Твой отказ приняли, открытку принесут на подпись
    note: Ты дочитал разговор. Вера купит открытку, Даня принесёт ручку. Захочешь ли подписать, можно решить в четверг.
  ask:
    mode: yellow
    messages:
    - ty-mozhno-ya-prosto-podpishu
    - vera-konechno-na-trene-dam
    outcome:
    - positive
    - Вера принесёт открытку на тренировку
    note: Саша предложил свой способ поучаствовать, и Вера подхватила идею.
  observe:
    mode: yellow
    messages:
    - vera-asks-about-card
    - trener-pro-podarok-uvidel-sash
    - sasha-da-ya-s-vami
    question: Ты видишь тренера у кабинета. Как хочешь выйти?
    choices:
      observe-ease: Пройду с тренером до крыльца. Пока ни о чём говорить не хочу.
      observe-watch: Попрошу Мишу встретить меня у крыльца.
    review:
      signals:
      - pressure/danya-togda-s-tebya-dvesti
      effect: Вера спросила про открытку. А в личке тебе написал тренер. Ты согласился выйти вместе с ним.
  observe-ease:
    mode: yellow
    messages:
    - remarka-trener-i-sasha-vmeste
    outcome:
    - positive
    - Вы с тренером дошли до крыльца
    note: Тренер сам подошёл к кабинету. Ты принял его предложение. До крыльца вы дошли вместе.
    review:
      signals:
      - observe/sasha-da-ya-s-vami
      effect: Тренер сам подошёл к кабинету. Ты принял его предложение. До крыльца вы дошли вместе.
  observe-watch:
    mode: orange
    messages:
    - sasha-vstretish-u-kryltsa
    - misha-zhdu-u-kryltsa
    - remarka-misha-zhdyot-u-kryltsa
    outcome:
    - positive
    - Ты вышел с тренером, у крыльца тебя ждал Миша
    note: Тренер подошёл к кабинету. Ты сам выбрал место встречи с Мишей и ещё до выхода получил его ответ.
    review:
      signals:
      - observe/sasha-da-ya-s-vami
      effect: Тренер подошёл к кабинету. Ты сам выбрал место встречи с Мишей и ещё до выхода получил его ответ.
  focus:
    mode: orange
    messages:
    - sasha-rereads-threat
    - trener-pro-podarok-uvidel-sash
    - sasha-private-agreement
    question: Тренер уже у двери. Как тебе удобнее выйти?
    choices:
      focus-ease: Пройду с тренером до крыльца. Пока ни о чём говорить не хочу.
      focus-watch: Попрошу Мишу встретить меня у крыльца.
    review:
      signals:
      - pressure/danya-togda-s-tebya-dvesti
      effect: Сообщение про двести осталось в чате. Тренер видел его и сам написал тебе в личку. Вы уже видите друг друга.
  focus-ease:
    mode: yellow
    messages:
    - sasha-walk-in-silence
    outcome:
    - positive
    - Вы с тренером дошли до крыльца
    note: Ты видел сообщение Дани, когда согласился пойти с тренером. До крыльца вы дошли рядом, и о деньгах по дороге говорить не пришлось.
    review:
      signals:
      - focus/sasha-private-agreement
      effect: Ты видел сообщение Дани, когда согласился пойти с тренером. До крыльца вы дошли рядом, и о деньгах по дороге говорить не пришлось.
  focus-watch:
    mode: orange
    messages:
    - sasha-picks-time-with-misha
    - misha-can-wait
    - sasha-sees-misha
    outcome:
    - positive
    - Ты вышел с тренером, у крыльца тебя ждал Миша
    note: Сначала ты договорился с тренером. Мише ты написал в личку, где встретиться. На крыльце он уже ждал тебя.
    review:
      signals:
      - focus/sasha-private-agreement
      effect: Сначала ты договорился с тренером. Мише ты написал в личку, где встретиться. На крыльце он уже ждал тебя.
  calm-watch:
    mode: white
    messages:
    - pack-training-kit
    outcome:
    - positive
    - Саша собрался на тренировку
    note: Даня вычеркнул тебя из списка. Ты отложил переписку и собрался на тренировку.
  meet-at-door:
    mode: orange
    messages:
    - ty-mish-vstret-menya-u
    - misha-da-ya-s-trenerom
    - sasha-waits-in-class
    - danya-sash-a-den-gi-2
    - remarka-ya-sobiralsya-skazat-chto
    - trener-dver-svobodna-ya-zdes
    - misha-ya-zdes-trener-tozhe
    - remarka-misha-zhdyot-u-otkrytoy
    question: Как ответишь Мише?
    reaction:
      from: remarka-ya-sobiralsya-skazat-chto
      through: misha-ya-zdes-trener-tozhe
      summary: Я собирался сказать, что мы уходим. Даже знал, какими словами. А сейчас стою и не могу их выговорить.
    choices:
      meet-at-door-next-0: Кивну и выйду вместе с Мишей.
      meet-at-door-next-1: Покажу Мише на тренера. Хочу подождать рядом с ним.
    review:
      signals:
      - pressure/danya-togda-s-tebya-dvesti
      - pressure/sasha-mish-oni-vchera-tozhe-2
      effect: Ты дождался Миши и тренера в классе с учительницей. Когда ты услышал Даню, Миша уже стоял рядом и мог увидеть твой ответ.
  meet-at-door-next-0:
    mode: yellow
    messages:
    - remarka-ty-kivaesh-misha-zhdyot
    outcome:
    - positive
    - Вы с Мишей вышли вместе
    note: Ты дождался Миши и тренера в классе с учительницей. Когда ты услышал Даню, Миша уже стоял рядом и мог увидеть твой ответ.
    review:
      signals:
      - meet-at-door/misha-ya-zdes-trener-tozhe
      effect: Ты киваешь. Миша ждёт, пока ты поравняешься с ним. Вы выходите вдвоём.
  meet-at-door-next-1:
    mode: orange
    messages:
    - remarka-misha-ponimaet-zhest-vy
    outcome:
    - positive
    - Тренер остался с вами
    note: Ты дождался Миши и тренера в классе с учительницей. Когда ты услышал Даню, Миша уже стоял рядом и мог увидеть твой ответ.
    review:
      signals:
      - meet-at-door/misha-ya-zdes-trener-tozhe
      effect: Миша понимает жест. Вы подходите к тренеру, и он остаётся с вами.
cues:
  pressure/danya-togda-s-tebya-dvesti: За отказ Даня повысил сумму и сказал, что будет ждать после уроков.
  pressure/sasha-mish-oni-vchera-tozhe-2: У раздевалки тебя ждали вчера. Сегодня ты можешь попросить Мишу и тренера прийти к тебе в класс.
  alternative/danya-sto-segodnya-pro-zavtra: Даже на предложение заплатить Даня ответил новой угрозой. Саша ещё может обратиться к взрослому до выхода из школы.
  observe/sasha-da-ya-s-vami: Ты видишь тренера у кабинета и уже сказал, что пойдёшь с ним.
  focus/sasha-private-agreement: Ты уже увидел тренера у своей двери и ответил ему лично.
  meet-at-door/misha-ya-zdes-trener-tozhe: Ты дождался Миши и тренера в классе с учительницей. Когда ты услышал Даню, Миша уже стоял рядом и мог увидеть твой ответ.
