scenes:
  start:
    mode: yellow
    messages:
    - danya-rebyat-po-sotke-na
    - sasha-ya-v-etot-raz-2
    choices:
      pressure: Читать дальше
      calm: Спокойный дубль
  pressure:
    mode: yellow
    messages:
    - danya-togda-s-tebya-dvesti
    - sasha-mish-oni-vchera-tozhe-2
    continuation: true
    question: Последний урок ещё не кончился. Что тебе сейчас подойдёт?
    choices:
      pressure-act-0: После отказа мне угрожают встречей. Подойду к дежурной до звонка.
      alternative: Может, если договорюсь о сотне, меня не будут ждать. Попробую сторговаться.
      pressure-act-1: Попрошу маму меня встретить. До встречи побуду у дежурной.
      observe: Может, Даня передумает. Пока просто почитаю чат секции.
      focus: После отказа уже двести. Посмотрю в чате, напишет ли Даня ещё.
      meet-at-door: Вчера они ждали у раздевалки. Попрошу Мишу меня там встретить.
  pressure-act-0:
    mode: red
    messages:
    - ty-marina-sergeevna-s-menya
    - marina-sergeevna-konechno-davay-zdes
    - ty-ya-sam-mame-napishu
    - marina-sergeevna-da-ya-zdes
    outcome:
    - positive
    - Марина Сергеевна остаётся с тобой
    note: Дежурная услышала, чего ты опасаешься, и осталась рядом. Можно вместе решить, с кем ты пойдёшь после уроков.
    review:
      signals:
      - pressure/danya-togda-s-tebya-dvesti
      effect: Дежурная услышала, чего ты опасаешься, и осталась рядом. Можно вместе решить, с кем ты пойдёшь после уроков.
  pressure-act-1:
    mode: red
    messages:
    - remarka-u-uchitel-skoy-ty-nahodish
    - ty-mam-smozhesh-menya-vstretit
    - mama-sashi-da-podozhdi-u
    outcome:
    - positive
    - Вы договорились, где встретитесь после уроков
    note: Дома знают и про угрозу, и где тебя найти. До встречи рядом есть взрослый, которому можно сказать, если станет страшно.
    review:
      signals:
      - pressure/danya-togda-s-tebya-dvesti
      effect: Дома знают и про угрозу, и где тебя найти. До встречи рядом есть взрослый, которому можно сказать, если станет страшно.
  alternative:
    mode: orange
    messages:
    - ty-davay-sto-kak-vnachale
    - danya-sto-segodnya-pro-zavtra
    - remarka-pered-poslednim-zvonkom-ty
    question: Что тебе сейчас подходит?
    choices:
      follow-up: Подойду к дежурной, пока не пошёл к выходу.
      pause: Закончить этот дубль здесь
    review:
      signals:
      - pressure/danya-togda-s-tebya-dvesti
      effect: Торг был попыткой выиграть время. Обещания оставить тебя в покое ты так и не получил. За угрозу отвечает Даня. Можно остаться возле дежурной, показать ей сообщение и попросить встретить тебя после уроков.
      miss: false
  follow-up:
    mode: red
    messages:
    - ty-marina-sergeevna-u-menya
    - marina-sergeevna-konechno-ostanus-s
    outcome:
    - positive
    - Рядом с Сашей осталась дежурная
    note: Ты рассказал про деньги и про то, что тебя обещали ждать после уроков. Дежурная согласилась побыть рядом и предложила вместе решить, кого позвать.
    review:
      signals:
      - alternative/danya-sto-segodnya-pro-zavtra
      effect: Ты рассказал про деньги и про то, что тебя обещали ждать после уроков. Дежурная согласилась побыть рядом и предложила вместе решить, кого позвать.
  pause:
    mode: orange
    messages:
    - remarka-na-etom-dubl-zakanchivaetsya
    outcome:
    - mixed
    - Даня продолжает требовать деньги
    note: Торг был попыткой выиграть время. Обещания оставить тебя в покое ты так и не получил. За угрозу отвечает Даня. Можно остаться возле дежурной, показать ей сообщение и попросить встретить тебя после уроков.
    review:
      signals:
      - alternative/danya-sto-segodnya-pro-zavtra
      effect: Можно взять паузу. Решать, возвращаться ли к этому разговору, по-прежнему тебе.
  calm:
    mode: yellow
    messages:
    - danya-ok-sash-vycherknul-ver-2
    - vera-sem-sot-na-otkrytku-hvatit
    continuation: true
    question: Как продолжишь?
    choices:
      calm-end: Посмотреть, что будет дальше
      ask: Предложить подписать открытку
      calm-watch: Посмотрю, что ребята решат с открыткой.
  calm-end:
    mode: yellow
    messages:
    - vera-kuplyu-otkrytku
    - danya-prinesu-ruchku
    outcome:
    - positive
    - Твой отказ приняли, открытку принесут на подпись
    note: Ты дочитал разговор. Вера купит открытку, Даня принесёт ручку. Захочешь ли подписать, можно решить в четверг.
  ask:
    mode: yellow
    messages:
    - ty-mozhno-ya-prosto-podpishu
    - vera-konechno-na-trene-dam
    outcome:
    - positive
    - Вера принесёт открытку на тренировку
    note: Саша предложил свой способ поучаствовать, и Вера подхватила идею.
  observe:
    mode: yellow
    messages:
    - trener-pro-podarok-uvidel-sash
    - sasha-da-ya-s-vami
    question: Ты видишь тренера у кабинета. Как хочешь выйти?
    choices:
      observe-ease: Пройду с тренером до крыльца. Пока ни о чём говорить не хочу.
      observe-watch: Попрошу Мишу встретить меня у крыльца.
    review:
      signals:
      - pressure/danya-togda-s-tebya-dvesti
      effect: Ты дочитал чат. Тренер увидел требование Дани, предложил выйти вместе и написал, где он. Ты его уже видишь.
  observe-ease:
    mode: yellow
    messages:
    - remarka-trener-i-sasha-vmeste
    outcome:
    - positive
    - Вы с тренером дошли до крыльца
    note: Тренер сам подошёл к кабинету. Ты принял его предложение. До крыльца вы дошли вместе.
    review:
      signals:
      - observe/sasha-da-ya-s-vami
      effect: Тренер сам подошёл к кабинету. Ты принял его предложение. До крыльца вы дошли вместе.
  observe-watch:
    mode: orange
    messages:
    - sasha-vstretish-u-kryltsa
    - misha-zhdu-u-kryltsa
    - remarka-misha-zhdyot-u-kryltsa
    outcome:
    - positive
    - Ты вышел с тренером, у крыльца тебя ждал Миша
    note: Тренер подошёл к кабинету. Ты сам выбрал место встречи с Мишей и ещё до выхода получил его ответ.
    review:
      signals:
      - observe/sasha-da-ya-s-vami
      effect: Тренер подошёл к кабинету. Ты сам выбрал место встречи с Мишей и ещё до выхода получил его ответ.
  focus:
