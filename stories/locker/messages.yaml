vera-ty-videl-ryukzak-mishi:
  speaker: Вера
  text: Ты видел рюкзак Миши? Он уже всю раздевалку обошёл.
danya-vernyom-k-zvonku-u:
  speaker: Даня
  text: Вернём к звонку. У нас игра такая.
danya-proydyosh-nash-kvest:
  speaker: Даня
  channel: scene
  caption: У раздевалки
  text: '[[Пройдёшь наш квест]] — заберёшь.'
misha-kakoy-eschyo-kvest-mne:
  speaker: Миша
  text: Какой ещё квест? Мне форму брать. [[Вчера тоже ждал]], пока наиграются.
vera-do-zvonka-pyat-minut:
  speaker: Вера
  text: До звонка пять минут. Я рядом.
ty-marina-sergeevna-podoydite-k:
  speaker: Ты
  text: Марина Сергеевна, подойдите к раздевалке! Даня рюкзак Миши взял, а там форма. Скоро урок.
marina-sergeevna-idu-mish-pokazhi:
  speaker: Марина Сергеевна
  text: Иду. Миш, покажи, где вы стояли.
remarka-danya-snimaet-ryukzak-s:
  speaker: Ремарка
  text: Даня снимает рюкзак с крючка за дверью и кладёт на лавку.
misha-vot-on-ya-pereodevat-sya:
  speaker: Миша
  text: Вот он. Я переодеваться.
ty-mish-poydyom-vmeste-k:
  speaker: Ты
  text: Миш, пойдём вместе к Марине Сергеевне?
misha-pozovyosh-eyo-syuda-a:
  speaker: Миша
  text: Позовёшь её сюда? А то если они его сейчас принесут, я опять пропущу.
ty-aga-seychas:
  speaker: Ты
  text: Ага, сейчас.
remarka-ty-nahodish-marinu-sergeevnu:
  speaker: Ремарка
  text: Ты находишь Марину Сергеевну у спортзала. Она идёт с тобой к раздевалке.
ty-mish-davay-doigraem-tak:
  speaker: Ты
  text: Миш, давай доиграем. Так быстрее рюкзак получишь.
misha-a-mne-kogda-pereodet-sya:
  speaker: Миша
  text: А мне когда переодеться?
remarka-zvenit-zvonok-ryukzak-snova:
  speaker: Ремарка
  text: Звенит звонок. Рюкзак снова лежит на лавке. Команда уже поделилась на пары, пока Миша переодевался.
misha-kost-ty-slyshal-kuda:
  speaker: Миша
  channel: scene
  caption: У лавки
  text: '[[Кость, ты слышал, куда они его спрятали? У меня там форма.]]'
misha-ya-uchitelya-sam-pozval:
  speaker: Миша
  channel: scene
  caption: После урока · у спортзала
  text: Я учителя сам позвал. На разминку уже не успел.
ty-marina-sergeevna-u-mishi:
  speaker: Ты
  channel: scene
  caption: Коридор у раздевалки
  text: Марина Сергеевна, у Миши забрали рюкзак. Он у раздевалки.
marina-sergeevna-poydyom-pokazhesh:
  speaker: Марина Сергеевна
  text: Пойдём, покажешь.
danya-mish-on-za-dver-yu:
  speaker: Даня
  text: Миш, он за дверью на крючке. Сейчас сниму.
remarka-danya-kladyot-ryukzak-na:
  speaker: Ремарка
  text: Даня кладёт рюкзак на лавку. Миша достаёт форму.
vera-poshli-v-zal-eschyo:
  speaker: Вера
  text: Пошли в зал, ещё успеваем.
remarka-misha-vhodit-v-zal:
  speaker: Ремарка
  text: Миша успевает переодеться. Звонок застаёт ребят уже в зале.
ty-mish-formu-nashyol:
  speaker: Ты
  text: Миш, тебя подождать?
misha-aga-vsyo-tut-dogonyu:
  speaker: Миша
  text: Идите, я переоденусь и догоню вас.
vera-dan-uzhe-pora-pereodevat-sya:
  speaker: Вера
  text: Дань, уже пора переодеваться.
remarka-danya-stavit-ryukzak-ryadom:
  speaker: Ремарка
  text: Даня ставит рюкзак рядом с Мишей. [[Миша достаёт форму]].
vera-ya-v-zal-vy:
  speaker: Вера
  text: Я в зал. Вы идёте?
remarka-v-razdevalke-zvonit-zvonok:
  speaker: Ремарка
  text: В раздевалке звонит звонок.
ty-gde-moy-ryukzak-ya:
  speaker: Ты
  text: Где мой рюкзак? Я оставил его на лавке.
danya-podozhdi-my-potom-otdadim:
  speaker: Даня
  text: Подожди, мы потом отдадим.
danya-proydyosh-nash-kvest-2:
  speaker: Даня
  text: '[[Пройдёшь наш квест]] — заберёшь.'
ty-kakoy-eschyo-kvest-mne:
  speaker: Ты
  text: Какой ещё квест? Мне форму брать. [[Вчера тоже ждал]], пока наиграются.
ty-dan-otday-ya-v:
  speaker: Ты
  text: Дань, отдай. Я в квесте не участвую. Мне переодеваться.
danya-ladno-za-dver-yu-na:
  speaker: Даня
  text: Ладно. За дверью, на крючке.
remarka-ty-snimaesh-ryukzak-forma:
  speaker: Ремарка
  text: Ты снимаешь рюкзак. Форма внутри.
ty-ver-poydyom-vmeste-k:
  speaker: Ты
  text: Вер, пойдём вместе к Марине Сергеевне?
vera-poshli-ya-videla-gde:
  speaker: Вера
  text: Пошли. Я видела, где он лежал до перемены.
marina-sergeevna-vy-ko-mne:
  speaker: Марина Сергеевна
  channel: scene
  caption: У спортзала
  text: Вы ко мне? Заходите.
ty-ladno-odin-raund-potom:
  speaker: Ты
  text: Ладно, один раунд. Потом сразу отдаёшь.
danya-tak-podozhdi-my-eschyo:
  speaker: Даня
  text: Так, подожди, мы ещё не придумали задание.
remarka-danya-otdayot-ryukzak-posle:
  speaker: Ремарка
  text: Даня отдаёт рюкзак после звонка. К тому времени, когда ты заходишь в зал, [[разминка уже закончилась]].
ty-ya-formu-zhdal-danya:
  speaker: Ты
  text: Я форму ждал. Даня взял рюкзак и сказал пройти квест.
marina-sergeevna-spasibo-chto-skazal:
  speaker: Марина Сергеевна
  text: Спасибо, что сказал. Присоединяйся к ребятам. После урока я подойду.
remarka-na-etom-dubl-zakanchivaetsya:
  speaker: Ремарка
  channel: scene
  text: Вера кидает тебе пас, и ты включаешься в игру.
ty-dan-ostavlyay-ego-na:
  speaker: Ты
  text: Дань, оставляй его на лавке, ладно? Я по всей раздевалке бегал.
danya-ladno:
  speaker: Даня
  text: Ладно.
kostya-waits-at-bench:
  speaker: Ты
  channel: scene
  text: Миш, я тут. Подожду с тобой.
kostya-offers-to-wait:
  speaker: Ты
  channel: scene
  text: Миш, у двери тебя подождать?
misha-ties-shoes:
  speaker: Миша
  text: Ага. Я только кеды зашнурую.
misha-points-out-bag:
  speaker: Ты
  channel: scene
  text: Вер, вон у Дани мой рюкзак. Видишь?
misha-asks-vera-to-wait:
  speaker: Ты
  channel: scene
  text: Вер, подождёшь меня у двери?
vera-gets-ball:
  speaker: Вера
  text: Конечно. Я пока мяч возьму.
misha-changes-shoes:
  speaker: Ремарка
  channel: scene
  caption: Перед уроком
  text: Ты садишься на лавку, надеваешь кеды и успеваешь за Верой в зал. Звонок уже там.
kostya-waits-in-gym:
  speaker: Ремарка
  channel: scene
  caption: У спортзала
  text: Ты доходишь до зала с Верой. Уже у двери оглядываешься и видишь Мишу в форме. Звонка ещё не было.
