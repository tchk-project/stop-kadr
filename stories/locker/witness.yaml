scenes:
  start:
    mode: yellow
    messages:
    - vera-ty-videl-ryukzak-mishi
    - danya-vernyom-k-zvonku-u
    choices:
      pressure: Читать дальше
      calm: Спокойный дубль
  pressure:
    mode: yellow
    messages:
    - danya-proydyosh-nash-kvest
    - misha-kakoy-eschyo-kvest-mne
    - vera-do-zvonka-pyat-minut
    continuation: true
    question: До звонка пять минут. Что ты сделаешь?
    choices:
      pressure-act-0: До звонка пять минут, а форма у Дани. Позову учительницу.
      alternative: Может, пройти квест быстрее. Предложу Мише доиграть.
      pressure-act-1: Миша вчера тоже ждал. Спрошу, что ему сейчас нужно.
      ignore: Пойду переодеваться. Наверняка сами успеют.
      observe: До звонка ещё есть время. Посмотрю, принесут ли рюкзак.
      focus: Подойду к лавке и останусь рядом с Мишей.
  pressure-act-0:
    mode: orange
    messages:
    - ty-marina-sergeevna-podoydite-k
    - marina-sergeevna-idu-mish-pokazhi
    - remarka-danya-snimaet-ryukzak-s
    - misha-vot-on-ya-pereodevat-sya
    outcome:
    - positive
    - Миша получил рюкзак до звонка
    note: Ты назвал, что случилось и где вы стоите. Пока учительница шла к вам, Даня вернул рюкзак.
    review:
      signals:
      - pressure/danya-proydyosh-nash-kvest
      - pressure/misha-kakoy-eschyo-kvest-mne
      effect: Ты назвал, что случилось и где вы стоите. Пока учительница шла к вам, Даня вернул рюкзак.
  pressure-act-1:
    mode: orange
    messages:
    - ty-mish-poydyom-vmeste-k
    - misha-pozovyosh-eyo-syuda-a
    - ty-aga-seychas
    - remarka-ty-nahodish-marinu-sergeevnu
    outcome:
    - positive
    - Миша ждёт у раздевалки, ты идёшь к нему с учительницей
    note: Миша хотел остаться там, где ему обещали вернуть рюкзак. Он смог попросить тебя сходить за помощью.
    review:
      signals:
      - pressure/danya-proydyosh-nash-kvest
      - pressure/misha-kakoy-eschyo-kvest-mne
      effect: Миша хотел остаться там, где ему обещали вернуть рюкзак. Он смог попросить тебя сходить за помощью.
  alternative:
    mode: yellow
    messages:
    - ty-mish-davay-doigraem-tak
    - misha-a-mne-kogda-pereodet-sya
    - remarka-zvenit-zvonok-ryukzak-snova
    outcome:
    - negative
    - Миша пропустил выбор пары
    note: Ты рассчитывал выиграть время. Когда ты предложил доиграть, Даня так и остался с рюкзаком до звонка. Мише ещё может пригодиться твоя помощь — например, рассказать учителю, почему он опоздал.
    review:
      signals:
      - pressure/danya-proydyosh-nash-kvest
      - pressure/misha-kakoy-eschyo-kvest-mne
      effect: Ты рассчитывал выиграть время. Когда ты предложил доиграть, Даня так и остался с рюкзаком до звонка. Мише ещё может пригодиться твоя помощь — например, рассказать учителю, почему он опоздал.
      miss: true
  ignore:
    mode: white
    messages:
    - misha-kost-ty-slyshal-kuda
    question: Мише пора в зал. Как ответишь про рюкзак?
    choices:
      stay: Махнуть рукой и уйти в зал.
      rejoin: Сходить за учителем, пока Миша ждёт у лавки.
    review:
      miss: true
      signals:
      - pressure/danya-proydyosh-nash-kvest
      - pressure/misha-kakoy-eschyo-kvest-mne
      effect: Миша подошёл к тебе за помощью. Пока рюкзак у ребят, он не может переодеться.
      repair: rejoin
      recovery: Учительница идёт к Мише.
  stay:
    mode: white
    messages:
    - misha-ya-uchitelya-sam-pozval
    outcome:
    - mixed
    - Мише пришлось самому искать учителя
    note: Миша успел обратиться к учителю сам. Когда рюкзак вернули, разминка уже началась.
    review:
      miss: true
      signals:
      - ignore/misha-kost-ty-slyshal-kuda
      effect: Миша успел обратиться к учителю сам. Когда рюкзак вернули, разминка уже началась.
  rejoin:
    mode: orange
    messages:
    - ty-marina-sergeevna-u-mishi
    - marina-sergeevna-poydyom-pokazhesh
    outcome:
    - positive
    - Учительница идёт к Мише
    note: Костя объяснил, где ждёт Миша. Учительница согласилась пойти с ним к раздевалке.
  calm:
    mode: yellow
    messages:
    - danya-mish-on-za-dver-yu
    - remarka-danya-kladyot-ryukzak-na
    continuation: true
    question: Как продолжишь?
    choices:
      calm-end: Пойду в зал вместе с ребятами.
      ask: Спросить, подождать ли Мишу
      calm-watch: Оглянусь у зала. Успел ли Миша переодеться?
  calm-end:
    mode: yellow
    messages:
    - vera-poshli-v-zal-eschyo
    - remarka-misha-vhodit-v-zal
    outcome:
    - positive
    - Рюкзак вернули до звонка
    note: Миша получил рюкзак и достал форму до урока. На этот раз никто не потребовал пройти квест.
  ask:
    mode: yellow
    messages:
    - ty-mish-formu-nashyol
    - misha-aga-vsyo-tut-dogonyu
    outcome:
    - positive
    - Миша догонит ребят в зале
    note: Костя предложил подождать. Миша сказал, что догонит ребят, когда переоденется.
  observe:
    mode: yellow
    messages:
    - vera-dan-uzhe-pora-pereodevat-sya
    - remarka-danya-stavit-ryukzak-ryadom
    question: Форма у Миши. Как пойдёшь в зал?
    choices:
      observe-ease: Форма нашлась. Пора на урок.
      observe-watch: Спрошу Мишу, подождать ли его у двери.
    review:
      signals:
      - pressure/danya-proydyosh-nash-kvest
      - pressure/misha-kakoy-eschyo-kvest-mne
      effect: Рюкзак вернули. Миша может сам достать свои вещи.
  observe-ease:
    mode: yellow
    messages:
    - vera-ya-v-zal-vy
    - remarka-v-razdevalke-zvonit-zvonok
    outcome:
    - positive
    - Рюкзак вернулся к хозяину до звонка
    note: Вера позвала ребят в зал. Когда в раздевалке прозвенел звонок, рюкзак уже был у Миши.
    review:
      signals:
      - observe/remarka-danya-stavit-ryukzak-ryadom
      effect: Вера позвала ребят в зал. Когда в раздевалке прозвенел звонок, рюкзак уже был у Миши.
  observe-watch:
    mode: orange
    messages:
    - kostya-offers-to-wait
    - misha-ties-shoes
    outcome:
    - positive
    - Миша попросил Костю подождать у двери
    note: Форма уже у Миши. Вы договорились идти на урок вместе.
    review:
      signals:
      - observe/remarka-danya-stavit-ryukzak-ryadom
      effect: Форма уже у Миши. Вы договорились идти на урок вместе.
  focus:
    mode: orange
    messages:
    - kostya-waits-at-bench
    - vera-dan-uzhe-pora-pereodevat-sya
    - remarka-danya-stavit-ryukzak-ryadom
    question: Форма у Миши. Как пойдёшь в зал?
    choices:
      focus-ease: Форма нашлась. Пора на урок.
      focus-watch: Спрошу Мишу, подождать ли его у двери.
    review:
      signals:
      - pressure/danya-proydyosh-nash-kvest
      - pressure/misha-kakoy-eschyo-kvest-mne
      effect: Ты остался рядом с Мишей. Вера напомнила про урок, и Даня вернул рюкзак.
  focus-ease:
    mode: yellow
    messages:
    - vera-ya-v-zal-vy
    - remarka-v-razdevalke-zvonit-zvonok
    outcome:
    - positive
    - Рюкзак вернулся к хозяину до звонка
    note: Вера позвала ребят в зал. Когда в раздевалке прозвенел звонок, рюкзак уже был у Миши.
    review:
      signals:
      - focus/remarka-danya-stavit-ryukzak-ryadom
      effect: Вера позвала ребят в зал. Когда в раздевалке прозвенел звонок, рюкзак уже был у Миши.
  focus-watch:
    mode: orange
    messages:
    - kostya-offers-to-wait
    - misha-ties-shoes
    outcome:
    - positive
    - Миша попросил Костю подождать у двери
    note: Форма уже у Миши. Вы договорились идти на урок вместе.
    review:
      signals:
      - focus/remarka-danya-stavit-ryukzak-ryadom
      effect: Форма уже у Миши. Вы договорились идти на урок вместе.
  calm-watch:
    mode: orange
    messages:
    - kostya-waits-in-gym
    outcome:
    - positive
    - Костя увидел Мишу у спортзала
    note: Рюкзак уже вернули. Косте хотелось убедиться, что Миша тоже успеет к началу урока.
cues:
  pressure/danya-proydyosh-nash-kvest: Даня поставил условие, прежде чем вернуть чужую вещь.
  pressure/misha-kakoy-eschyo-kvest-mne: Миша говорит, что это повторилось.
  ignore/misha-kost-ty-slyshal-kuda: Миша ищет именно рюкзак с формой к уроку.
  observe/remarka-danya-stavit-ryukzak-ryadom: Ты видел, как Даня поставил рюкзак у лавки и Миша достал форму.
  focus/remarka-danya-stavit-ryukzak-ryadom: Ты видел, как Даня поставил рюкзак у лавки и Миша достал форму.
