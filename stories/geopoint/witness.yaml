scenes:
  start:
    mode: yellow
    messages:
    - ty-an-u-tebya-fotka
    - anya-aga-ya-na-ostanovke
    - lyosha-tim-ty-s-aney
    choices:
      pressure: Читать дальше
      calm: Спокойный дубль
  pressure:
    mode: yellow
    messages:
    - ty-mne-lyosha-napisal-sprashivaet
    - anya-ya-emu-uzhe-skazala
    continuation: true
    question: Аня попросила не говорить, где она. Что сделаешь?
    choices:
      pressure-act-0: Аня просила не говорить, где она. Отвечу Лёше без подробностей.
      alternative: Саму остановку я не назову. Скажу только, что она ещё не уехала.
      pressure-act-1: Лёша ищет её через меня. Побуду с Аней на связи.
      ignore: Оставить оба чата. Разберутся между собой.
      observe: Не буду отвечать Лёше про остановку. Посмотрю, напишет ли он ещё.
      focus: Отвечу Ане одним сообщением, что сохраню её маршрут в тайне.
  pressure-act-0:
    mode: orange
    messages:
    - ty-ya-za-anyu-otvechat
    - lyosha-ponyal-ya-dumal-vy
    outcome:
    - positive
    - Тимур оставил Анин маршрут в тайне
    note: Лёша получил ответ от Тимура, но не узнал от него, где Аня. Что скажут другие, пока неизвестно.
    review:
      signals:
      - pressure/anya-ya-emu-uzhe-skazala
      effect: Лёша получил ответ от Тимура, но не узнал от него, где Аня. Что скажут другие, пока неизвестно.
  pressure-act-1:
    mode: orange
    messages:
    - ty-ya-ne-skazal-hochesh
    - anya-aga-do-avtobusa-a
    - ty-davay-ya-tut
    outcome:
    - positive
    - Тимур остаётся на связи до автобуса
    note: Аня сама назвала, какая поддержка ей сейчас подходит и как долго она нужна.
    review:
      signals:
      - pressure/anya-ya-emu-uzhe-skazala
      effect: Аня сама назвала, какая поддержка ей сейчас подходит и как долго она нужна.
  alternative:
    mode: orange
    messages:
    - ty-my-ne-vmeste-ona
    - lyosha-a-togda-podozhdu-u
    - ty-an-ya-skazal-chto
    - anya-tim-ya-zhe-prosila
    outcome:
    - negative
    - Лёша решил подождать Аню у кружка
    note: Тимур не назвал остановку, но подтвердил, что Аня ещё рядом. Лёша решил её ждать. Увиделись ли они, неизвестно. Тимур уже сказал Ане, что передал; теперь можно спросить, нужна ли ей компания.
    review:
      signals:
      - pressure/anya-ya-emu-uzhe-skazala
      effect: Тимур не назвал остановку, но подтвердил, что Аня ещё рядом. Лёша решил её ждать. Увиделись ли они, неизвестно. Тимур уже сказал Ане, что передал; теперь можно спросить, нужна ли ей компания.
      miss: true
  ignore:
    mode: white
    messages:
    - anya-tim-skazhi-hot-ty
    question: Аня ждёт ответа. Что сделаешь с её сообщением?
    choices:
      stay: Убрать телефон, отвечу потом.
      rejoin: Подтвердить Ане, что никому не сказал.
    review:
      miss: true
      signals:
      - pressure/anya-ya-emu-uzhe-skazala
      effect: Аня знает, что Лёша спрашивал тебя о ней. Она пока не знает, что ты ему ответил.
      repair: rejoin
      recovery: Аня знает, что Тимур сохранил её просьбу в тайне.
  stay:
    mode: white
    messages:
    - anya-ya-doehala-tak-i
    outcome:
    - mixed
    - Аня не знала, передали ли её маршрут
    note: Тимур сохранил маршрут в тайне. Аня до самого дома не знала, какой ответ получил Лёша.
    review:
      miss: true
      signals:
      - ignore/anya-tim-skazhi-hot-ty
      effect: Тимур сохранил маршрут в тайне. Аня до самого дома не знала, какой ответ получил Лёша.
  rejoin:
    mode: orange
    messages:
    - ty-net-nichego-emu-ne
    - anya-spasibo-a-to-stoyu
    outcome:
    - positive
    - Аня знает, что Тимур сохранил её просьбу в тайне
    note: Аня получила прямой ответ. Ей больше не приходится гадать, передал ли Тимур её маршрут.
  calm:
    mode: yellow
    messages:
    - lyosha-a-vsyo-otboy-ona
    continuation: true
    question: Как продолжишь?
    choices:
      calm-end: Дождусь фотографии и сверю с Аней ответ.
      ask: Уточнить у Ани насчёт фотографии
      calm-watch: Пока Аня едет, попробую сам решить задачу.
  calm-end:
    mode: yellow
    messages:
    - anya-vot-fotka-u-menya
    - timur-tozhe-shest-spasibo
    outcome:
    - positive
    - Разговор вернулся к задаче с доски
    note: Лёша принял ответ. У Ани и Тимура по-прежнему есть своё дело — сверить решение.
  ask:
    mode: yellow
    messages:
    - ty-fotku-ne-srochno-mozhno
    - anya-horosho-kak-doedu
    outcome:
    - positive
    - Аня и Тимур договорились про фотографию
    note: Аня и Тимур сами договорились, когда удобно вернуться к фотографии.
  observe:
    mode: yellow
    messages:
    - lyosha-ladno-ya-uzhe-sel
    question: Лёша написал тебе, что сел в автобус. Что дальше?
    choices:
      observe-ease: Дождусь фотографии. Лёше про остановку отвечать не буду.
      observe-watch: Скажу Ане, что Лёша написал мне про автобус.
    review:
      signals:
      - pressure/anya-ya-emu-uzhe-skazala
      effect: Лёша написал, что сел в автобус, и попрощался. Про остановку он больше не спрашивал.
  observe-ease:
    mode: yellow
    messages:
    - anya-uzhe-doma-seychas-prishlyu
    - timur-spasibo
    outcome:
    - positive
    - Аня сама написала Тимуру из дома
    note: Аня сама написала тебе из дома и предложила вернуться к задаче. Её остановку ты никому не назвал.
    review:
      signals:
      - observe/lyosha-ladno-ya-uzhe-sel
      effect: Аня сама написала тебе из дома и предложила вернуться к задаче. Её остановку ты никому не назвал.
  observe-watch:
    mode: orange
    messages:
    - timur-relays-bus-message
    - anya-thanks-timur
    outcome:
    - positive
    - Аня узнала, о чём писал Лёша
    note: Ты передал Ане слова Лёши. Её местоположение осталось между вами.
    review:
      signals:
      - observe/lyosha-ladno-ya-uzhe-sel
      effect: Ты передал Ане слова Лёши. Её местоположение осталось между вами.
  focus:
    mode: orange
    messages:
    - timur-promises-privacy
    - lyosha-ladno-ya-uzhe-sel
    question: Лёша написал тебе, что сел в автобус. Что дальше?
    choices:
      focus-ease: Дождусь фотографии. Лёше про остановку отвечать не буду.
      focus-watch: Скажу Ане, что Лёша написал мне про автобус.
    review:
      signals:
      - pressure/anya-ya-emu-uzhe-skazala
      effect: Ты пообещал Ане не называть её остановку. Лёша написал тебе отдельно, что сел в автобус.
  focus-ease:
    mode: yellow
    messages:
    - anya-uzhe-doma-seychas-prishlyu
    - timur-spasibo
    outcome:
    - positive
    - Аня сама написала Тимуру из дома
    note: Аня сама написала тебе из дома и предложила вернуться к задаче. Её остановку ты никому не назвал.
    review:
      signals:
      - focus/lyosha-ladno-ya-uzhe-sel
      effect: Аня сама написала тебе из дома и предложила вернуться к задаче. Её остановку ты никому не назвал.
  focus-watch:
    mode: orange
    messages:
    - timur-updates-anya
    - anya-acknowledges-update
    outcome:
    - positive
    - Аня получила от Тимура новость про автобус
    note: Тимур уже обещал Ане сохранить её остановку в тайне. Теперь он передал ей последнее сообщение Лёши, и Аня попрощалась до вечера.
    review:
      signals:
      - focus/lyosha-ladno-ya-uzhe-sel
      effect: Тимур уже обещал Ане сохранить её остановку в тайне. Теперь он передал ей последнее сообщение Лёши, и Аня попрощалась до вечера.
  calm-watch:
    mode: white
    messages:
    - timur-works-on-problem
    outcome:
    - positive
    - Тимур записал свой ответ
    note: Лёша сам закончил разговор про остановку. У тебя было время заняться задачей.
cues:
  pressure/anya-ya-emu-uzhe-skazala: Аня прямо сказала Тимуру, какую информацию хочет оставить между ними.
  ignore/anya-tim-skazhi-hot-ty: С Аней можно связаться напрямую. Она хочет знать, что услышал от тебя Лёша.
  observe/lyosha-ladno-ya-uzhe-sel: Лёша написал тебе про автобус. Остановку он больше не спрашивал.
  focus/lyosha-ladno-ya-uzhe-sel: Лёша написал тебе про автобус. Остановку он больше не спрашивал.
