ty-an-u-tebya-fotka:
  speaker: Ты
  channel: lichnaya-perepiska-s-aney
  text: Ань, у тебя фотка с доски осталась? У меня цифры расплылись.
anya-aga-ya-na-ostanovke:
  speaker: Аня
  text: Ага. Я на остановке, доеду — скину.
lyosha-tim-ty-s-aney:
  speaker: Лёша
  channel: lichnaya-perepiska-s-lyoshey
  text: Тим, ты с Аней? Она ещё у кружка?
ty-mne-lyosha-napisal-sprashivaet:
  speaker: Ты
  channel: lichnaya-perepiska-s-aney
  text: Мне Лёша написал, спрашивает, где ты. Ответить ему?
anya-ya-emu-uzhe-skazala:
  speaker: Аня
  text: Я ему уже сказала, что сама доеду. [[Не говори, где я]], ладно?
ty-ya-za-anyu-otvechat:
  speaker: Ты
  channel: lichnaya-perepiska-s-lyoshey
  text: Я за Аню отвечать не буду, Лёш.
lyosha-ponyal-ya-dumal-vy:
  speaker: Лёша
  text: Понял. Я думал, вы вместе вышли.
ty-ya-ne-skazal-hochesh:
  speaker: Ты
  channel: lichnaya-perepiska-s-aney
  text: Я не сказал. Хочешь, побыть на связи?
anya-aga-do-avtobusa-a:
  speaker: Аня
  text: Ага, до автобуса. А то я на каждый звук телефон достаю.
ty-davay-ya-tut:
  speaker: Ты
  text: Давай. Я тут.
ty-my-ne-vmeste-ona:
  speaker: Ты
  channel: lichnaya-perepiska-s-lyoshey
  text: Мы не вместе. Она пока не уехала, это всё, что я знаю.
lyosha-a-togda-podozhdu-u:
  speaker: Лёша
  text: А, тогда подожду у кружка.
ty-an-ya-skazal-chto:
  speaker: Ты
  channel: lichnaya-perepiska-s-aney
  text: Ань, я сказал, что ты ещё не уехала. Он пишет, что подождёт. Зря я ответил.
anya-tim-ya-zhe-prosila:
  speaker: Аня
  text: Тим, я же просила. Теперь думаю, идти туда завтра или он опять ждать будет.
anya-tim-skazhi-hot-ty:
  speaker: Аня
  channel: lichnaya-perepiska-s-aney
  text: '[[Тим, скажи хоть, ты ему ответил? Я не хочу, чтобы меня встречали.]]'
anya-ya-doehala-tak-i:
  speaker: Аня
  text: Я доехала. Так и не знала, сказал ты или нет.
ty-net-nichego-emu-ne:
  speaker: Ты
  text: Нет, ничего ему не писал. Не скажу.
anya-spasibo-a-to-stoyu:
  speaker: Аня
  text: Спасибо. А то стою и гадаю.
lyosha-a-vsyo-otboy-ona:
  speaker: Лёша
  channel: lichnaya-perepiska-s-lyoshey
  text: А, всё, отбой. Она сказала, что сама доедет.
anya-vot-fotka-u-menya:
  speaker: Аня
  channel: lichnaya-perepiska-s-aney
  text: Вот фотка. У меня получилось шесть, а у тебя?
timur-tozhe-shest-spasibo:
  speaker: Тимур
  text: Тоже шесть! Спасибо.
ty-fotku-ne-srochno-mozhno:
  speaker: Ты
  channel: lichnaya-perepiska-s-aney
  text: Фотку не срочно, можно вечером.
anya-horosho-kak-doedu:
  speaker: Аня
  text: Хорошо, как доеду.
lyosha-ladno-ya-uzhe-sel:
  speaker: Лёша
  channel: lichnaya-perepiska-s-lyoshey
  text: Ладно, [[я уже сел в автобус]]. До завтра.
anya-uzhe-doma-seychas-prishlyu:
  speaker: Аня
  channel: lichnaya-perepiska-s-aney
  text: Уже дома. Сейчас пришлю задачу.
timur-spasibo:
  speaker: Тимур
  text: Спасибо!
lyosha-skin-tochku-vstrechu-posle:
  speaker: Лёша
  channel: lichnaya-perepiska-s-lyoshey
  text: Скинь точку, встречу после кружка.
ty-segodnya-sama-do-zavtra:
  speaker: Ты
  text: Сегодня сама. До завтра.
timur-an-u-tebya-fotka:
  speaker: Тимур
  channel: lichnaya-perepiska-s-timurom
  text: Ань, у тебя фотка с доски осталась? У меня цифры расплылись.
ty-aga-ya-na-ostanovke:
  speaker: Ты
  text: Ага. Я на остановке, доеду — скину.
lyosha-da-chto-takogo-vklyuchi:
  speaker: Лёша
  channel: lichnaya-perepiska-s-lyoshey
  text: Да что такого? Включи гео до дома. [[Ты же мне доверяешь]]?
timur-mne-lyosha-napisal-sprashivaet:
  speaker: Тимур
  channel: lichnaya-perepiska-s-timurom
  text: Мне Лёша написал, спрашивает, где ты. Ответить ему?
ty-ya-emu-uzhe-skazala:
  speaker: Ты
  text: Я ему уже сказала, что сама доеду. [[Не говори, где я]], ладно?
ty-lyosh-tochku-skidyvat-ne:
  speaker: Ты
  channel: lichnaya-perepiska-s-lyoshey
  text: Лёш, точку скидывать не буду. Увидимся завтра.
remarka-ty-ubiraesh-telefon-v:
  speaker: Ремарка
  text: Ты убираешь телефон в карман. Геолокация выключена.
ty-tim-mozhesh-pobyt-na:
  speaker: Ты
  channel: lichnaya-perepiska-s-timurom
  text: Тим, можешь побыть на связи, пока автобус не придёт?
timur-ya-tut-i-lyoshe:
  speaker: Тимур
  text: Я тут. И Лёше про тебя ничего не сказал.
ty-spasibo-von-moy-edet:
  speaker: Ты
  text: Спасибо. Вон мой едет.
ty-ladno-tol-ko-do-doma:
  speaker: Ты
  channel: lichnaya-perepiska-s-lyoshey
  text: Ладно. Только до дома, хорошо?
sistema-ty-podelilas-geolokatsiey:
  speaker: Система
  text: Ты поделилась геолокацией.
lyosha-a-chego-stoish-do:
  speaker: Лёша
  channel: lichnaya-perepiska-s-lyoshey
  caption: Позже
  text: '[[А чего стоишь]]? До дома же ещё идти.'
ty-v-magazin-zashla-za:
  speaker: Ты
  text: В магазин зашла, за хлебом.
remarka-ochered-sdvigaetsya-ty-snova:
  speaker: Ремарка
  text: 'Очередь сдвигается. Ты снова смотришь в телефон: вдруг он спросит ещё что-нибудь.'
remarka-ty-prekraschaesh-delit-sya-geolokatsiey:
  speaker: Ремарка
  text: Ты прекращаешь делиться геолокацией.
sistema-peredacha-geopozitsii-zavershena:
  speaker: Система
  text: Передача геопозиции завершена.
remarka-na-etom-dubl-zakanchivaetsya:
  speaker: Ремарка
  text: На этом дубль заканчивается.
lyosha-ok-togda-do-zavtra:
  speaker: Лёша
  channel: lichnaya-perepiska-s-lyoshey
  text: Ок, тогда до завтра.
anya-vot-fotka-u-menya-2:
  speaker: Аня
  channel: lichnaya-perepiska-s-timurom
  text: Вот фотка. У меня получилось шесть, а у тебя?
ty-domoy-pridu-i-sfotkayu:
  speaker: Ты
  channel: lichnaya-perepiska-s-timurom
  text: Домой приду и сфоткаю ещё решение, ладно?
timur-da-spasibo:
  speaker: Тимур
  text: Да, спасибо.
anya-uzhe-doma-seychas-prishlyu-2:
  speaker: Аня
  channel: lichnaya-perepiska-s-timurom
  text: Уже дома. Сейчас пришлю задачу.
timur-promises-privacy:
  speaker: Ты
  channel: lichnaya-perepiska-s-aney
  text: Понял. Где ты, ему не скажу.
timur-relays-bus-message:
  speaker: Ты
  channel: lichnaya-perepiska-s-aney
  text: Лёша написал, что сел в автобус. Про тебя я ему ничего не говорил.
anya-thanks-timur:
  speaker: Аня
  text: Спасибо, Тим. А то я гадала, что ты ему ответил.
anya-asks-for-update:
  speaker: Ты
  channel: lichnaya-perepiska-s-timurom
  text: Тим, если он ещё про меня спросит, напишешь мне?
timur-agrees-to-write:
  speaker: Тимур
  text: Ага, напишу.
anya-arranges-call:
  speaker: Ты
  channel: lichnaya-perepiska-s-timurom
  text: Тим, гео не включала. Давай я позже тебе наберу?
timur-agrees-to-call:
  speaker: Тимур
  text: Давай. Я дома буду.
