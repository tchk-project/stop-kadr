scenes:
  start:
    mode: yellow
    messages:
    - kostya-tim-u-nas-novichki
    - timur-ya-by-prosto-poehal
    choices:
      pressure: Читать дальше
      calm: Спокойный дубль
  pressure:
    mode: yellow
    messages:
    - kostya-togda-sadish-sya-otdel-no-s
    - timur-ya-voobsche-uzhe-ehat
    - trener-cherez-pyat-minut-edem
    continuation: true
    question: Что ты сделаешь до выезда?
    choices:
      alternative: Может, один припев снимет вопрос. Предложу Тимуру подпеть вместе.
      pressure-act-0: Тимуру назначили условие за место. Предложу соседнее без песни.
      pressure-act-1: Костя решает за весь автобус. Скажу тренеру перед выездом.
      ignore: Сесть в автобус. Про песни поболтают и забудут.
      observe: Автобус ещё закрыт. Посмотрю, кто куда сядет.
      focus: Останусь рядом с Тимуром, пока двери закрыты.
  pressure-act-0:
    mode: orange
    messages:
    - ty-tim-tut-svobodno-syadesh
    - timur-aga-mne-luchshe-u
    - remarka-ty-peresazhivaesh-sya-k-prohodu
    - remarka-iz-kolonki-vdrug-slyshno
    - remarka-timur-priotkryl-rot-i
    - trener-mish-ya-u-peredney
    question: Ты рядом с Тимуром. Что сделаешь?
    choices:
      pressure-act-0-next-0: Тихо спрошу, хочет ли он, чтобы я попросил выключить колонку.
      pressure-act-0-next-1: Останусь рядом. Предложу Тимуру написать мне, если так удобнее.
    review:
      signals:
      - pressure/kostya-togda-sadish-sya-otdel-no-s
      - pressure/timur-ya-voobsche-uzhe-ehat
      effect: Тимур смог занять место рядом. Вы ещё не обсуждали со всей командой, что будет с другими новичками.
  pressure-act-1:
    mode: orange
    messages:
    - ty-trener-timuru-skazali-ne
    - trener-sadites-s-kostey-ya
    - timur-mish-kin-mne-kurtku
    outcome:
    - positive
    - У Тимура есть место, тренер знает про условие
    note: Пока вы садитесь, тренер может сам разобраться с условием про микрофон. Личное сообщение Тимура ты при всех не зачитывал.
    review:
      signals:
      - pressure/kostya-togda-sadish-sya-otdel-no-s
      - pressure/timur-ya-voobsche-uzhe-ehat
      effect: Пока вы садитесь, тренер может сам разобраться с условием про микрофон. Личное сообщение Тимура ты при всех не зачитывал.
  alternative:
    mode: yellow
    messages:
    - ty-tim-davay-odnu-pesnyu
    - timur-ya-i-tebe-dolzhen
    - remarka-kogda-otkryvayutsya-dveri-avtobusa
    outcome:
    - negative
    - Тимур сел один
    note: Ты предложил Тимуру компанию, но за место рядом ему всё ещё предстояло выступить. Он уже отказался. Можно подойти на остановке, извиниться и предложить свободное место без условий.
    review:
      signals:
      - pressure/kostya-togda-sadish-sya-otdel-no-s
      - pressure/timur-ya-voobsche-uzhe-ehat
      effect: Ты предложил Тимуру компанию, но за место рядом ему всё ещё предстояло выступить. Он уже отказался. Можно подойти на остановке, извиниться и предложить свободное место без условий.
      miss: true
  ignore:
    mode: white
    messages:
    - timur-mish-u-tebya-ryadom
    question: Теперь ты знаешь ещё кое-что. Что сделаешь?
    choices:
      stay: Сделать вид, что занят сумкой.
      rejoin: Снять сумку с сиденья.
    review:
      miss: true
      signals:
      - pressure/kostya-togda-sadish-sya-otdel-no-s
      - pressure/timur-ya-voobsche-uzhe-ehat
      effect: 'После твоего решения разговор продолжился: «Миш, у тебя рядом свободно или тут тоже только с песней?»'
      repair: rejoin
      recovery: Тимур сел рядом без условий.
  stay:
    mode: white
    messages:
    - sasha-tim-idi-ko-mne
    outcome:
    - mixed
    - Место Тимуру предложил Саша
    note: Миша промолчал. Саша предложил место без условий, и Тимуру больше не пришлось торговаться из-за песни.
    review:
      miss: true
      signals:
      - ignore/timur-mish-u-tebya-ryadom
      effect: Миша промолчал. Саша предложил место без условий, и Тимуру больше не пришлось торговаться из-за песни.
  rejoin:
    mode: orange
    messages:
    - ty-svobodno-s-pesney-kostya
    - timur-aga-poderzhish-myach
    outcome:
    - positive
    - Тимур сел рядом без условий
    note: Миша освободил сиденье. Тимур сам выбрал сесть у окна.
  calm:
    mode: yellow
    messages:
    - kostya-nu-ladno-kto-sam
    - sasha-davay-syuda-tim-u
    continuation: true
    question: Как продолжишь?
    choices:
      calm-end: Посмотреть, что будет дальше
      ask: Позвать Тимура на соседнее место
      calm-watch: Посмотрю, где Тимур сядет, когда автобус тронется.
  calm-end:
    mode: yellow
    messages:
    - remarka-timur-saditsya-u-okna
    outcome:
    - positive
    - Тимур поехал на игру со всеми
    note: После отказа место осталось свободным. Петь вызвался Саша.
  ask:
    mode: yellow
    messages:
    - ty-tim-tut-tozhe-svobodno
    - timur-ya-u-okna-uvidimsya
    outcome:
    - positive
    - Тимур выбрал место у окна
    note: Для места в автобусе не пришлось ничего исполнять. Ребята сами выбрали, куда сесть.
  observe:
    mode: yellow
    messages:
    - sasha-tim-ya-kurtku-ubral
    - remarka-timur-saditsya-ryadom-s
    question: Тимур сел с Сашей. Что дальше?
    choices:
      observe-ease: С местом разобрались. Поехали.
      observe-watch: Спрошу Тимура в личке, как ему на новом месте.
    review:
      signals:
      - pressure/kostya-togda-sadish-sya-otdel-no-s
      - pressure/timur-ya-voobsche-uzhe-ehat
      effect: Рядом нашлось место без условия про песню.
  observe-ease:
    mode: yellow
    messages:
    - trener-vse-na-mestah-poehali
    outcome:
    - positive
    - Тимур едет на игру рядом с Сашей
    note: Рядом нашлось место без условия про песню.
    review:
      signals:
      - observe/remarka-timur-saditsya-ryadom-s
      effect: Рядом нашлось место без условия про песню.
  observe-watch:
    mode: orange
    messages:
    - misha-checks-in
    - timur-talks-football
    outcome:
    - positive
    - Тимур рассказал Мише, как устроился
    note: Ты спросил у Тимура наедине. Он сам рассказал, чем занят с Сашей.
    review:
      signals:
      - observe/remarka-timur-saditsya-ryadom-s
      effect: Ты спросил у Тимура наедине. Он сам рассказал, чем занят с Сашей.
  focus:
    mode: orange
    messages:
    - misha-waits-with-timur
    - sasha-tim-ya-kurtku-ubral
    - remarka-timur-saditsya-ryadom-s
    question: Тимур сел с Сашей. Что дальше?
    choices:
      focus-ease: С местом разобрались. Поехали.
      focus-watch: Спрошу Тимура в личке, как ему на новом месте.
    review:
      signals:
      - pressure/kostya-togda-sadish-sya-otdel-no-s
      - pressure/timur-ya-voobsche-uzhe-ehat
      effect: Ты ждал у автобуса вместе с Тимуром. Место у окна ему предложил Саша.
  focus-ease:
    mode: yellow
    messages:
    - trener-vse-na-mestah-poehali
    outcome:
    - positive
    - Тимур едет на игру рядом с Сашей
    note: Рядом нашлось место без условия про песню.
    review:
      signals:
      - focus/remarka-timur-saditsya-ryadom-s
      effect: Рядом нашлось место без условия про песню.
  focus-watch:
    mode: orange
    messages:
    - misha-checks-in
    - timur-talks-football
    outcome:
    - positive
    - Тимур рассказал Мише, как устроился
    note: Ты спросил у Тимура наедине. Он сам рассказал, чем занят с Сашей.
    review:
      signals:
      - focus/remarka-timur-saditsya-ryadom-s
      effect: Ты спросил у Тимура наедине. Он сам рассказал, чем занят с Сашей.
  calm-watch:
    mode: orange
    messages:
    - remarka-timur-saditsya-u-okna
    outcome:
    - positive
    - Тимур поехал на игру со всеми
    note: После отказа место осталось свободным. Петь вызвался Саша.
  pressure-act-0-next-0:
    mode: orange
    messages:
    - remarka-timur-kivaet-ty-peredayosh
    outcome:
    - positive
    - Тренер выключил колонку по вашей просьбе
    note: Ты освободил место у окна. Теперь вы можете поговорить вдвоём, даже когда остальные смотрят на Тимура.
    review:
      signals:
      - pressure-act-0/trener-mish-ya-u-peredney
      effect: Тимур кивает. Ты передаёшь просьбу тренеру. Тот выключает колонку.
  pressure-act-0-next-1:
    mode: orange
    messages:
    - remarka-timur-dostayot-telefon-na
    outcome:
    - positive
    - Тимур написал, чего ему хочется
    note: Ты освободил место у окна. Теперь вы можете поговорить вдвоём, даже когда остальные смотрят на Тимура.
    review:
      signals:
      - pressure-act-0/trener-mish-ya-u-peredney
      effect: 'Тимур достаёт телефон. На твоём экране появляется: «Посиди со мной до выезда».'
cues:
  pressure/kostya-togda-sadish-sya-otdel-no-s: После отказа Костя поставил условие даже для места в автобусе.
  pressure/timur-ya-voobsche-uzhe-ehat: Тимур написал в личку, что теперь думает пропустить поездку.
  pressure-act-0/trener-mish-ya-u-peredney: Ты освободил место у окна. Теперь вы можете поговорить вдвоём, даже когда остальные смотрят на Тимура.
  ignore/timur-mish-u-tebya-ryadom: Теперь к тебе обратились напрямую.
  observe/remarka-timur-saditsya-ryadom-s: Рядом нашлось место без условия про песню.
  focus/remarka-timur-saditsya-ryadom-s: Рядом нашлось место без условия про песню.
