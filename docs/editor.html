<header class="mast"><a href="./editor.html" class="brand">Стоп-кадр<span> / Редактор историй</span></a><a class="game-link" href="./index.html">К игре ↗</a></header>
<template id="character-list">
<ul class="cast-list">
<li><span class="cast-avatar" aria-hidden="true" style="background-position:0% 0%"></span><div><strong>Вера</strong><p>Замечает, кому нужен клей, чья куртка осталась на стуле. Иногда так торопится заступиться, что говорит лишнее. Если её просят помолчать, может остановиться.</p></div></li>
<li><span class="cast-avatar" aria-hidden="true" style="background-position:33.333333333333336% 0%"></span><div><strong>Миша</strong><p>Первым шутит над собственным промахом. Собирает слайды, играет в группе и в команде с Лёшей. Когда спешит, способен упустить, что важно другому.</p></div></li>
<li><span class="cast-avatar" aria-hidden="true" style="background-position:66.66666666666667% 0%"></span><div><strong>Костя</strong><p>Собирает людей на игру, начинает голосования. Ему трудно оставить место в команде пустым. Способен услышать отказ и предложить другой дубль.</p></div></li>
<li><span class="cast-avatar" aria-hidden="true" style="background-position:100% 0%"></span><div><strong>Саша</strong><p>Задаёт короткий вопрос о том, что будет дальше. Хочет ехать рядом с другом. Когда за него заплатили, первым делом уточняет, кому теперь должен.</p></div></li>
<li><span class="cast-avatar" aria-hidden="true" style="background-position:0% 33.333333333333336%"></span><div><strong>Даня</strong><p>Любит, когда на его шутку тут же отвечают. В голосовом может увлечь других в насмешку. На дискотеке замечает свободный стул и может быстро помочь Ане.</p></div></li>
<li><span class="cast-avatar" aria-hidden="true" style="background-position:33.333333333333336% 33.333333333333336%"></span><div><strong>Аня</strong><p>Быстро замечает пропущенное имя. У неё утром тренировка, ей нужен сон. В компании прямо говорит, когда хочет просто посидеть.</p></div></li>
<li><span class="cast-avatar" aria-hidden="true" style="background-position:66.66666666666667% 33.333333333333336%"></span><div><strong>Тимур</strong><p>Помнит, как и почему переделывал графики. Не всегда хочет к доске. Если видит, что другу перекрыли дорогу, окликает дежурную по имени.</p></div></li>
<li><span class="cast-avatar" aria-hidden="true" style="background-position:100% 33.333333333333336%"></span><div><strong>Лёша</strong><p>С напарником говорит коротко и по делу, помнит вчерашнюю игру. В конфликте бывает настойчив после отказа. В каждой истории значение имеет конкретный поступок.</p></div></li>
<li><span class="cast-avatar" aria-hidden="true" style="background-position:66.66666666666667% 66.66666666666667%"></span><div><strong>Лера</strong><p>Держит в голове, кто что приносит и сколько времени осталось. Больше всего её задевает, когда все заметили стикер, а вопрос о клее пропустили.</p></div></li>
</ul>
<p class="cast-others"><strong>Другие собеседники.</strong> Марина Сергеевна — учительница, тренер ведёт секцию. В историях также встречаются мама Саши, админ чата и модератор игры.</p>
</template>
<main id="app"></main>
